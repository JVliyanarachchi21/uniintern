<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificate - Uni Intern</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Merriweather:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            200: '#bfdbfe',
                            300: '#93c5fd',
                            400: '#60a5fa',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            800: '#1e40af',
                            900: '#1e3a8a',
                            950: '#172554',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Merriweather', 'serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            color: #1e293b;
            background-color: #f1f5f9;
            -webkit-font-smoothing: antialiased;
        }
        @media print {
            body * {
                visibility: hidden;
            }
            #certificate-container, #certificate-container * {
                visibility: visible;
            }
            #certificate-container {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                margin: 0;
                padding: 0;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            @page {
                size: landscape;
                margin: 0;
            }
        }
    </style>
</head>
<body class="min-h-screen bg-slate-100 flex flex-col">
    <!-- Non-printable header -->
    <header class="bg-white border-b border-slate-200 py-4 px-6 flex items-center justify-between print:hidden sticky top-0 z-10">
        <a th:href="@{/results(courseId=${courseId})}" class="flex items-center gap-2 text-slate-600 hover:text-slate-900 transition-colors font-medium">
            <i data-lucide="arrow-left" class="w-4.5 h-4.5"></i>
            Back to Results
        </a>
        <div class="flex gap-4">
            <button onclick="downloadPDF()" id="download-btn"
                class="bg-brand-600 hover:bg-brand-700 disabled:bg-brand-400 text-white font-semibold py-2.5 px-6 rounded-lg transition-colors flex items-center gap-2 shadow-sm">
                <i data-lucide="download" class="w-4.5 h-4.5"></i>
                <span id="btn-text">Download Certificate PDF</span>
            </button>
        </div>
    </header>

    <main class="flex-1 flex items-center justify-center p-8 print:p-0 print:bg-white">
        <!-- Certificate Container -->
        <div id="certificate-container"
            class="w-full max-w-[1000px] aspect-[1.414/1] bg-white relative overflow-hidden shadow-2xl print:shadow-none print:w-[100vw] print:h-[100vh] print:max-w-none">

            <!-- Decorative Borders -->
            <div class="absolute inset-0 border-[16px] border-brand-900 m-4"></div>
            <div class="absolute inset-0 border-2 border-brand-200 m-8"></div>

            <!-- Corner Ornaments -->
            <div class="absolute top-8 left-8 w-16 h-16 border-t-4 border-l-4 border-brand-500"></div>
            <div class="absolute top-8 right-8 w-16 h-16 border-t-4 border-r-4 border-brand-500"></div>
            <div class="absolute bottom-8 left-8 w-16 h-16 border-b-4 border-l-4 border-brand-500"></div>
            <div class="absolute bottom-8 right-8 w-16 h-16 border-b-4 border-r-4 border-brand-500"></div>

            <!-- Background Pattern -->
            <div class="absolute inset-0 opacity-[0.03] pointer-events-none"
                style="background-image: radial-gradient(#1e3a8a 2px, transparent 2px); background-size: 30px 30px;">
            </div>

            <!-- Content -->
            <div class="absolute inset-0 flex flex-col items-center justify-center p-16 text-center z-10">
                <div class="mb-8">
                    <h2 class="text-3xl font-bold text-brand-900 tracking-widest uppercase font-serif">Uni Intern</h2>
                    <div class="w-24 h-1 bg-brand-500 mx-auto mt-4"></div>
                </div>

                <h1 class="text-5xl md:text-6xl font-serif font-bold text-slate-900 mb-6 tracking-tight">Certificate of Completion</h1>

                <p class="text-xl text-slate-600 mb-6 italic font-serif">This is to certify that</p>

                <h2 class="text-4xl md:text-5xl font-bold text-brand-700 mb-6 border-b-2 border-slate-200 pb-2 px-12 inline-block" th:text="${userName} ?: 'Student Name'">
                    Student Name
                </h2>

                <p class="text-lg text-slate-600 mb-4 max-w-2xl">
                    has successfully completed the comprehensive curriculum and passed the final assessment for the course:
                </p>

                <h3 class="text-3xl font-bold text-slate-900 mb-12" th:text="${courseTitle} ?: 'Course Title'">Course Title</h3>

                <!-- Footer details -->
                <div class="w-full flex justify-between items-end px-16 mt-auto">
                    <div class="text-center">
                        <div class="text-lg font-bold text-slate-900 mb-1" th:text="${#dates.format(#dates.createNow(), 'MMMM d, yyyy')}">Date</div>
                        <div class="w-40 h-px bg-slate-400 mb-2"></div>
                        <div class="text-sm text-slate-500 uppercase tracking-wider">Date of Issue</div>
                    </div>

                    <div class="text-center">
                        <div class="w-24 h-24 rounded-full border-4 border-brand-100 flex items-center justify-center bg-white shadow-sm mb-4 mx-auto">
                            <div class="text-center">
                                <div class="text-xs font-bold text-slate-400 uppercase">Grade</div>
                                <div class="text-2xl font-bold text-brand-600" th:text="${grade} ?: 'A'">A</div>
                            </div>
                        </div>
                    </div>

                    <div class="text-center">
                        <div class="font-serif text-2xl text-slate-800 italic mb-1">Dr. Alan Turing</div>
                        <div class="w-48 h-px bg-slate-400 mb-2"></div>
                        <div class="text-sm text-slate-500 uppercase tracking-wider">Program Director</div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        lucide.createIcons();

        async function downloadPDF() {
            const btn = document.getElementById('download-btn');
            const btnText = document.getElementById('btn-text');
            const certificateElement = document.getElementById('certificate-container');

            btn.disabled = true;
            btnText.textContent = 'Generating PDF...';

            try {
                const canvas = await html2canvas(certificateElement, {
                    scale: 2,
                    useCORS: true,
                    allowTaint: true,
                    backgroundColor: '#ffffff'
                });

                const imgData = canvas.toDataURL('image/png');
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF({
                    orientation: 'landscape',
                    unit: 'mm',
                    format: 'a4'
                });

                const imgWidth = 297;
                const imgHeight = (canvas.height * imgWidth) / canvas.width;

                pdf.addImage(imgData, 'PNG', 0, 0, imgWidth, imgHeight);

                const userName = document.querySelector('h2.text-4xl').textContent.trim().replace(/\s+/g, '_');
                const courseTitle = document.querySelector('h3.text-3xl').textContent.trim().replace(/\s+/g, '_');
                pdf.save(`${userName}_${courseTitle}_Certificate.pdf`);
            } catch (error) {
                console.error('Error generating PDF:', error);
                alert('Error generating PDF. Please try again.');
            } finally {
                btn.disabled = false;
                btnText.textContent = 'Download Certificate PDF';
            }
        }
    </script>
</body>
</html>
