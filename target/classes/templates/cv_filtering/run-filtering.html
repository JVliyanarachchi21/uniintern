<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Run Filtering')}"></head>
<body class="flex h-screen w-full bg-gray-100 overflow-hidden font-sans">
    <div th:replace="~{fragments/layout :: sidebar('RunFiltering')}"></div>
    
    <div class="flex-1 flex flex-col h-full overflow-hidden">
        <div th:replace="~{fragments/layout :: header('RunFiltering')}"></div>
        
        <main class="flex-1 overflow-y-auto p-6 scroll-smooth">
            <div class="max-w-7xl mx-auto">
                <div class="space-y-6 animate-fade-in max-w-3xl mx-auto">
                    <div class="mb-8 text-center">
                        <div class="w-16 h-16 bg-brand-100 rounded-full flex items-center justify-center mx-auto mb-4">
                            <svg class="w-8 h-8 text-brand-600 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                            </svg>
                        </div>
                        <h2 class="text-3xl font-bold text-gray-900">Run Filtering Engine</h2>
                        <p class="text-gray-500 mt-2 max-w-lg mx-auto">
                            Select an internship to process applications, calculate scores, and generate candidate rankings based on the company's marking guide.
                        </p>
                    </div>

                    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-8">
                        <form th:action="@{/run-filtering}" method="post">
                            <div class="mb-6">
                                <label for="internship" class="block text-sm font-medium text-gray-700 mb-2">Select Internship</label>
                                <select id="internship" name="internshipId" class="w-full bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-brand-500 focus:border-brand-500 block p-3 outline-none transition-colors">
                                    <option value="">-- Select an internship --</option>
                                    <option th:each="i : ${availableInternships}" th:value="${i.id}" th:text="${i.title} + ' at ' + ${i.company}">Internship at Company</option>
                                </select>
                            </div>

                            <div class="flex flex-col sm:flex-row gap-4">
                                <button type="button" onclick="previewApplicants()" disabled id="previewBtn"
                                        class="flex-1 py-3 px-4 bg-white border border-gray-300 text-gray-700 font-medium rounded-lg shadow-sm hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-500 disabled:opacity-50 disabled:cursor-not-allowed transition-colors flex items-center justify-center">
                                    <svg class="w-5 h-5 mr-2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path>
                                    </svg>
                                    Preview Applicants
                                </button>

                                <button type="submit" id="runBtn" disabled
                                        class="flex-1 py-3 px-4 bg-brand-600 hover:bg-brand-700 text-white font-medium rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-500 disabled:opacity-50 disabled:cursor-not-allowed transition-all flex items-center justify-center">
                                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path>
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                                    </svg>
                                    Run Filtering Now
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <script>
        document.getElementById('internship').addEventListener('change', function() {
            const hasValue = this.value !== '';
            document.getElementById('previewBtn').disabled = !hasValue;
            document.getElementById('runBtn').disabled = !hasValue;
        });
        
        function previewApplicants() {
            const internshipId = document.getElementById('internship').value;
            if (internshipId) {
                window.location.href = '/applicants-preview?internshipId=' + internshipId;
            }
        }
    </script>
</body>
</html>
