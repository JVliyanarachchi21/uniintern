<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Results')}"></head>
<body class="flex h-screen w-full bg-gray-100 overflow-hidden font-sans">
    <div th:replace="~{fragments/layout :: sidebar('ResultsList')}"></div>
    
    <div class="flex-1 flex flex-col h-full overflow-hidden">
        <div th:replace="~{fragments/layout :: header('ResultsList')}"></div>
        
        <main class="flex-1 overflow-y-auto p-6 scroll-smooth">
            <div class="max-w-7xl mx-auto">
                <div class="space-y-6 animate-fade-in">
                    <div class="mb-8 flex justify-between items-end">
                        <div>
                            <h2 class="text-2xl font-bold text-gray-900">Filtering Results</h2>
                            <p class="text-gray-500 mt-1">Ranked candidate lists awaiting admin review.</p>
                        </div>
                    </div>

                    <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                        <div class="overflow-x-auto">
                            <table class="w-full text-sm text-left">
                                <thead class="text-xs text-gray-500 uppercase bg-gray-50 border-b border-gray-100">
                                    <tr>
                                        <th class="px-6 py-4 font-medium">Internship</th>
                                        <th class="px-6 py-4 font-medium">Company</th>
                                        <th class="px-6 py-4 font-medium">Run Date</th>
                                        <th class="px-6 py-4 font-medium">Applicants</th>
                                        <th class="px-6 py-4 font-medium">Status</th>
                                        <th class="px-6 py-4 font-medium text-right">Actions</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-gray-100">
                                    <tr th:if="${#lists.isEmpty(runs)}">
                                        <td colspan="6" class="px-6 py-12 text-center text-gray-500">
                                            No filtering results found. Run the engine to generate results.
                                        </td>
                                    </tr>
                                    <tr th:each="run : ${runs}" class="hover:bg-gray-50 transition-colors">
                                        <td class="px-6 py-4">
                                            <div class="font-medium text-gray-900" th:text="${run.internshipTitle}">Title</div>
                                        </td>
                                        <td class="px-6 py-4 text-gray-600" th:text="${run.company}">Company</td>
                                        <td class="px-6 py-4 text-gray-600" th:text="${#temporals.format(run.finishedAt, 'MMM dd, yyyy HH:mm')}">Date</td>
                                        <td class="px-6 py-4 text-gray-600" th:text="${run.applicantsProcessed}">0</td>
                                        <td class="px-6 py-4">
                                            <span th:class="'px-2 py-1 text-xs font-medium rounded-full ' + 
                                                (${run.status == 'completed'} ? 'badge-completed' : 
                                                (${run.status == 'pending_approval'} ? 'badge-pending' : 
                                                (${run.status == 'approved'} ? 'badge-approved' : 
                                                (${run.status == 'rejected'} ? 'badge-rejected' : 'badge-failed'))))"
                                                  th:text="${run.status == 'pending_approval'} ? 'Pending Approval' : ${#strings.capitalize(run.status)}">
                                                Status
                                            </span>
                                        </td>
                                        <td class="px-6 py-4 text-right space-x-2">
                                            <a th:href="@{/ranking-detail/{id}(id=${run.id})}" 
                                               class="inline-flex items-center px-3 py-1.5 border border-gray-300 shadow-sm text-xs font-medium rounded text-gray-700 bg-white hover:bg-gray-50 transition-colors">
                                                <svg class="w-4 h-4 mr-1.5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                                                </svg>
                                                Rankings
                                            </a>
                                            <button onclick="alert('Mock CSV Download Started')" 
                                                    class="inline-flex items-center px-3 py-1.5 border border-gray-300 shadow-sm text-xs font-medium rounded text-gray-700 bg-white hover:bg-gray-50 transition-colors"
                                                    title="Export CSV">
                                                <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                                                </svg>
                                            </button>
                                            <a th:href="@{/run-filtering(internshipId=${run.internshipId})}" 
                                               th:class="${run.status == 'approved'} ? 'inline-flex items-center px-3 py-1.5 border border-gray-200 shadow-sm text-xs font-medium rounded text-gray-400 bg-gray-50 cursor-not-allowed' : 'inline-flex items-center px-3 py-1.5 border border-gray-300 shadow-sm text-xs font-medium rounded text-gray-700 bg-white hover:bg-gray-50 transition-colors'"
                                               th:attr="disabled=${run.status == 'approved'} ? 'disabled' : null"
                                               th:title="${run.status == 'approved'} ? 'Cannot re-run approved results' : 'Re-run filtering'">
                                                <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                                                </svg>
                                            </a>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
