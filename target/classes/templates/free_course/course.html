<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${courseTitle} + ' - Uni Intern'">Course - Uni Intern</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Merriweather:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            200: '#bfdbfe',
                            300: '#93c5fd',
                            400: '#60a5fa',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            800: '#1e40af',
                            900: '#1e3a8a',
                            950: '#172554',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Merriweather', 'serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            color: #f8fafc;
            background-color: #020617;
            -webkit-font-smoothing: antialiased;
        }
    </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-50 flex flex-col">
    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 py-4 px-6 flex items-center justify-between">
        <a th:href="@{/dashboard}" class="flex items-center gap-2 text-slate-400 hover:text-white transition-colors text-sm font-medium">
            <i data-lucide="arrow-left" class="w-4.5 h-4.5"></i>
            Back to Dashboard
        </a>
        <div class="font-semibold text-slate-200" th:text="${courseTitle} ?: 'Course Title'">Course Title</div>
        <div class="w-24"></div>
    </header>

    <main class="flex-1 flex flex-col max-w-6xl w-full mx-auto p-6">
        <div class="w-full aspect-video bg-black rounded-xl overflow-hidden shadow-2xl border border-slate-800 mb-8 relative">
            <iframe
                width="100%"
                height="100%"
                th:src="'https://www.youtube.com/embed/' + ${youtubeId} + '?autoplay=1&rel=0'"
                th:title="${courseTitle}"
                frameborder="0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                allowfullscreen
                class="absolute inset-0">
            </iframe>
        </div>

        <div class="flex flex-col md:flex-row items-center justify-between bg-slate-900 rounded-xl p-6 border border-slate-800 gap-6">
            <div class="flex-1">
                <h2 class="text-2xl font-bold text-white mb-2" th:text="${courseTitle} ?: 'Course Title'">Course Title</h2>
                <p class="text-slate-400 text-sm" th:text="${courseDescription} ?: 'Course description goes here.'">Course description goes here.</p>
            </div>

            <div class="flex flex-col items-center md:items-end gap-3 min-w-[250px]">
                <div id="timer-section" class="flex flex-col items-center md:items-end gap-2 w-full">
                    <div class="flex items-center gap-2 text-amber-400 text-sm font-medium bg-amber-400/10 px-4 py-2 rounded-full">
                        <i data-lucide="alert-circle" class="w-4 h-4"></i>
                        Quiz unlocks in <span id="timer">15</span>s
                    </div>
                    <div class="w-full bg-slate-800 rounded-full h-1.5 overflow-hidden">
                        <div id="progress-bar" class="bg-amber-400 h-full transition-all duration-1000" style="width: 0%"></div>
                    </div>
                    <p class="text-xs text-slate-500">(Demo timer for testing purposes)</p>
                </div>

                <div id="quiz-section" class="hidden flex flex-col items-center md:items-end gap-3 w-full">
                    <div class="flex items-center gap-2 text-emerald-400 text-sm font-medium">
                        <i data-lucide="check-circle-2" class="w-4 h-4"></i>
                        Video completed
                    </div>
                    <a th:href="@{/quiz(courseId=${courseId})}" id="start-quiz-btn"
                        class="w-full md:w-auto bg-brand-600 hover:bg-brand-500 text-white font-semibold py-3 px-8 rounded-lg transition-colors flex items-center justify-center gap-2 shadow-lg shadow-brand-600/20">
                        Start Quiz
                        <i data-lucide="arrow-right" class="w-4.5 h-4.5"></i>
                    </a>
                </div>
            </div>
        </div>
    </main>

    <script>
        lucide.createIcons();

        // Demo timer for testing
        const DEMO_DURATION = 15;
        let timeLeft = DEMO_DURATION;
        const timerElement = document.getElementById('timer');
        const progressBar = document.getElementById('progress-bar');
        const timerSection = document.getElementById('timer-section');
        const quizSection = document.getElementById('quiz-section');

        const timer = setInterval(() => {
            timeLeft--;
            timerElement.textContent = timeLeft;
            progressBar.style.width = ((DEMO_DURATION - timeLeft) / DEMO_DURATION * 100) + '%';

            if (timeLeft <= 0) {
                clearInterval(timer);
                timerSection.classList.add('hidden');
                quizSection.classList.remove('hidden');
                lucide.createIcons();
            }
        }, 1000);
    </script>
</body>
</html>
