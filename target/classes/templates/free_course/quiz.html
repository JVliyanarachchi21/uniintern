<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Quiz - ' + ${courseTitle}">Quiz - Uni Intern</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Merriweather:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            200: '#bfdbfe',
                            300: '#93c5fd',
                            400: '#60a5fa',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            800: '#1e40af',
                            900: '#1e3a8a',
                            950: '#172554',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Merriweather', 'serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            color: #1e293b;
            background-color: #f8fafc;
            -webkit-font-smoothing: antialiased;
        }
    </style>
</head>
<body class="min-h-screen bg-slate-50 flex flex-col">
    <!-- Quiz Header -->
    <header class="bg-white border-b border-slate-200 py-4 px-6 sticky top-0 z-10">
        <div class="max-w-3xl mx-auto flex flex-col gap-4">
            <div class="flex items-center justify-between">
                <h1 class="font-bold text-slate-900" th:text="${courseTitle} + ' - Final Quiz'">Course - Final Quiz</h1>
                <span class="text-sm font-medium text-slate-500">
                    Question <span id="current-question">1</span> of <span id="total-questions">20</span>
                </span>
            </div>
            <div class="w-full bg-slate-100 rounded-full h-2 overflow-hidden">
                <div id="progress-bar" class="bg-brand-500 h-full rounded-full transition-all duration-300" style="width: 5%"></div>
            </div>

            <!-- Question Navigation Dots -->
            <div class="flex justify-center gap-2 mt-4 flex-wrap" id="question-dots">
                <!-- Dots will be generated by JavaScript -->
            </div>
        </div>
    </header>

    <main class="flex-1 flex items-center justify-center p-6">
        <div class="w-full max-w-3xl">
            <div id="quiz-container" class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8 md:p-10">
                <h2 id="question-text" class="text-2xl font-semibold text-slate-900 mb-8 leading-relaxed">
                    Loading question...
                </h2>

                <div id="options-container" class="space-y-3 mb-8">
                    <!-- Options will be generated by JavaScript -->
                </div>

                <div id="error-message" class="hidden flex items-center gap-2 text-red-500 text-sm font-medium mb-4 bg-red-50 p-3 rounded-lg">
                    <i data-lucide="alert-circle" class="w-4 h-4"></i>
                    Please select an answer before proceeding.
                </div>

                <div class="flex justify-between border-t border-slate-100 pt-6">
                    <button id="prev-btn" onclick="previousQuestion()"
                        class="bg-slate-100 hover:bg-slate-200 disabled:bg-slate-50 disabled:text-slate-300 text-slate-700 font-semibold py-3 px-8 rounded-lg transition-colors flex items-center gap-2">
                        <i data-lucide="arrow-left" class="w-4.5 h-4.5"></i>
                        Previous
                    </button>
                    <button id="next-btn" onclick="nextQuestion()"
                        class="bg-brand-600 hover:bg-brand-700 text-white font-semibold py-3 px-8 rounded-lg transition-colors flex items-center gap-2">
                        <span id="next-btn-text">Next Question</span>
                        <i data-lucide="arrow-right" class="w-4.5 h-4.5" id="next-icon"></i>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script th:inline="javascript">
        lucide.createIcons();

        // Quiz data passed from server
        const quizData = /*[[${quizData}]]*/ [];
        const courseId = /*[[${courseId}]]*/ '';

        let currentIndex = 0;
        let answers = new Array(quizData.length).fill(-1);

        function renderQuestion() {
            const question = quizData[currentIndex];
            document.getElementById('question-text').textContent = question.text;
            document.getElementById('current-question').textContent = currentIndex + 1;

            // Update progress bar
            const progress = ((currentIndex + 1) / quizData.length) * 100;
            document.getElementById('progress-bar').style.width = progress + '%';

            // Render options
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            question.options.forEach((option, idx) => {
                const isSelected = answers[currentIndex] === idx;
                const button = document.createElement('button');
                button.className = `w-full text-left p-4 rounded-xl border-2 transition-all flex items-center gap-4 group ${
                    isSelected ? 'border-brand-500 bg-brand-50' : 'border-slate-100 bg-white hover:border-brand-200 hover:bg-slate-50'
                }`;
                button.onclick = () => selectOption(idx);

                button.innerHTML = `
                    <div class="flex-shrink-0 transition-colors ${isSelected ? 'text-brand-500' : 'text-slate-300 group-hover:text-brand-300'}">
                        ${isSelected ? '<i data-lucide="check-circle-2" class="w-6 h-6"></i>' : '<i data-lucide="circle" class="w-6 h-6"></i>'}
                    </div>
                    <span class="text-lg ${isSelected ? 'text-brand-900 font-medium' : 'text-slate-700'}">${option}</span>
                `;
                optionsContainer.appendChild(button);
            });

            // Update navigation buttons
            document.getElementById('prev-btn').disabled = currentIndex === 0;
            document.getElementById('next-btn-text').textContent = currentIndex === quizData.length - 1 ? 'Submit Quiz' : 'Next Question';

            if (currentIndex === quizData.length - 1) {
                document.getElementById('next-icon').classList.add('hidden');
            } else {
                document.getElementById('next-icon').classList.remove('hidden');
            }

            // Update dots
            renderDots();

            // Hide error
            document.getElementById('error-message').classList.add('hidden');

            lucide.createIcons();
        }

        function renderDots() {
            const dotsContainer = document.getElementById('question-dots');
            dotsContainer.innerHTML = '';

            quizData.forEach((_, index) => {
                const isAnswered = answers[index] !== -1;
                const isCurrent = index === currentIndex;

                const dot = document.createElement('button');
                dot.className = `w-8 h-8 rounded-full flex items-center justify-center text-xs font-medium transition-all ${
                    isCurrent ? 'bg-brand-500 text-white' :
                    isAnswered ? 'bg-brand-100 text-brand-700 border-2 border-brand-300' :
                    'bg-slate-200 text-slate-500 hover:bg-slate-300'
                }`;
                dot.textContent = index + 1;
                dot.onclick = () => jumpToQuestion(index);
                dotsContainer.appendChild(dot);
            });
        }

        function selectOption(optionIndex) {
            answers[currentIndex] = optionIndex;
            renderQuestion();
        }

        function nextQuestion() {
            if (answers[currentIndex] === -1) {
                document.getElementById('error-message').classList.remove('hidden');
                return;
            }

            if (currentIndex === quizData.length - 1) {
                submitQuiz();
            } else {
                currentIndex++;
                renderQuestion();
            }
        }

        function previousQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                renderQuestion();
            }
        }

        function jumpToQuestion(index) {
            currentIndex = index;
            renderQuestion();
        }

        function submitQuiz() {
            // Calculate results
            let correctCount = 0;
            answers.forEach((answer, index) => {
                if (answer === quizData[index].correctIndex) {
                    correctCount++;
                }
            });

            const score = Math.round((correctCount / quizData.length) * 100);
            const incorrectCount = quizData.length - correctCount;
            const passed = score >= 45;

            let grade;
            if (score >= 90) grade = 'A';
            else if (score >= 80) grade = 'B';
            else if (score >= 70) grade = 'B-';
            else if (score >= 60) grade = 'C';
            else if (score >= 45) grade = 'Pass';
            else grade = 'F';

            // Submit form
            const form = document.createElement('form');
            form.method = 'POST';
            form.action = '/results';

            const fields = {
                courseId: courseId,
                score: score,
                correctCount: correctCount,
                incorrectCount: incorrectCount,
                grade: grade,
                passed: passed
            };

            for (const [key, value] of Object.entries(fields)) {
                const input = document.createElement('input');
                input.type = 'hidden';
                input.name = key;
                input.value = value;
                form.appendChild(input);
            }

            document.body.appendChild(form);
            form.submit();
        }

        // Initialize
        document.getElementById('total-questions').textContent = quizData.length;
        renderQuestion();
    </script>
</body>
</html>
