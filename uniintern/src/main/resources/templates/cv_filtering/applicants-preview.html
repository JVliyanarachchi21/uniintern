<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{cv_filtering/fragments/layout :: head('Applicants Preview')}"></head>
<body class="flex h-screen w-full bg-gray-100 overflow-hidden font-sans">
    <div th:replace="~{cv_filtering/fragments/layout :: sidebar('ApplicantsPreview')}"></div>
    
    <div class="flex-1 flex flex-col h-full overflow-hidden">
        <div th:replace="~{cv_filtering/fragments/layout :: header('ApplicantsPreview')}"></div>
        
        <main class="flex-1 overflow-y-auto p-6 scroll-smooth">
            <div class="max-w-7xl mx-auto">
                <div class="space-y-6 animate-fade-in">
                    <div class="mb-8 flex justify-between items-end">
                        <div>
                            <a th:href="@{/run-filtering}" class="text-sm text-brand-600 hover:text-brand-800 flex items-center mb-2">
                                <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                                </svg>
                                Back to Run Filtering
                            </a>
                            <h2 class="text-2xl font-bold text-gray-900">Applicants Preview</h2>
                            <p class="text-gray-500 mt-1" th:if="${internship != null}" th:text="${internship.title} + ' at ' + ${internship.company}">Internship at Company</p>
                        </div>
                    </div>

                    <div th:if="${#lists.isEmpty(applications)}" class="bg-white rounded-xl shadow-sm border border-gray-100 p-8 text-center">
                        <p class="text-gray-500">No applications found for this internship.</p>
                    </div>

                    <div th:if="${!#lists.isEmpty(applications)}" class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                        <div class="overflow-x-auto">
                            <table class="w-full text-sm text-left">
                                <thead class="text-xs text-gray-500 uppercase bg-gray-50 border-b border-gray-100">
                                    <tr>
                                        <th class="px-6 py-4 font-medium">Student</th>
                                        <th class="px-6 py-4 font-medium">University</th>
                                        <th class="px-6 py-4 font-medium">GPA</th>
                                        <th class="px-6 py-4 font-medium">Skills</th>
                                        <th class="px-6 py-4 font-medium">Experience</th>
                                        <th class="px-6 py-4 font-medium">Completeness</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-gray-100">
                                    <tr th:each="app : ${applications}" class="hover:bg-gray-50 transition-colors">
                                        <td class="px-6 py-4">
                                            <div class="font-medium text-gray-900" th:text="${app.student.name}">Name</div>
                                            <div class="text-xs text-gray-500" th:text="${app.student.email}">Email</div>
                                        </td>
                                        <td class="px-6 py-4 text-gray-600" th:text="${app.student.university}">University</td>
                                        <td class="px-6 py-4 text-gray-600" th:text="${app.student.gpa}">3.5</td>
                                        <td class="px-6 py-4">
                                            <div class="flex flex-wrap gap-1">
                                                <span th:each="skill : ${app.student.skills}" 
                                                      class="px-1.5 py-0.5 bg-brand-50 text-brand-600 text-xs rounded"
                                                      th:text="${skill}">Skill</span>
                                            </div>
                                        </td>
                                        <td class="px-6 py-4 text-gray-600" th:text="${app.student.experienceCount} + ' (' + ${app.student.experienceMonths} + ' months)'">2 (12 months)</td>
                                        <td class="px-6 py-4">
                                            <div class="flex items-center">
                                                <div class="w-16 bg-gray-200 rounded-full h-2 mr-2">
                                                    <div class="bg-brand-600 h-2 rounded-full" th:style="'width:' + ${app.completeness} + '%'"></div>
                                                </div>
                                                <span class="text-xs text-gray-600" th:text="${app.completeness} + '%'">90%</span>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
