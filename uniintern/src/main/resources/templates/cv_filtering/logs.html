<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{cv_filtering/fragments/layout :: head('Logs / History')}"></head>
<body class="flex h-screen w-full bg-gray-100 overflow-hidden font-sans">
    <div th:replace="~{cv_filtering/fragments/layout :: main('LogsHistory', ~{::content})}">
        <div th:fragment="content" class="space-y-6 animate-fade-in">
            <div class="mb-8">
                <h2 class="text-3xl font-black text-gray-900 tracking-tight">System Logs</h2>
                <p class="text-gray-500 font-medium">Detailed activity history of the filtering engine.</p>
            </div>

            <div class="bg-white rounded-[2rem] shadow-sm border border-gray-200 overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left">
                        <thead>
                            <tr class="bg-gray-50 border-b border-gray-100">
                                <th class="px-8 py-5 text-[10px] font-black text-gray-400 uppercase tracking-widest">Run ID</th>
                                <th class="px-8 py-5 text-[10px] font-black text-gray-400 uppercase tracking-widest">Internship</th>
                                <th class="px-8 py-5 text-[10px] font-black text-gray-400 uppercase tracking-widest">Timeline</th>
                                <th class="px-8 py-5 text-[10px] font-black text-gray-400 uppercase tracking-widest">Applicants</th>
                                <th class="px-8 py-5 text-[10px] font-black text-gray-400 uppercase tracking-widest">Result</th>
                                <th class="px-8 py-5 text-[10px] font-black text-gray-400 uppercase tracking-widest">Notes</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-100">
                            <tr th:if="${#lists.isEmpty(logs)}">
                                <td colspan="6" class="px-8 py-12 text-center text-gray-500 font-medium italic">
                                    No activity logs recorded yet.
                                </td>
                            </tr>
                            <tr th:each="log : ${logs}" class="hover:bg-gray-50/50 transition-colors">
                                <td class="px-8 py-6">
                                    <span class="text-xs font-black text-brand-600" th:text="'#' + ${log.runId}">#1</span>
                                </td>
                                <td class="px-8 py-6">
                                    <div class="text-sm font-black text-gray-900" th:text="${log.internshipTitle}">Title</div>
                                </td>
                                <td class="px-8 py-6">
                                    <div class="text-[10px] font-bold text-gray-400">
                                        Started: <span class="text-gray-600" th:text="${#temporals.format(log.startedAt, 'HH:mm:ss')}">00:00:00</span><br>
                                        Date: <span class="text-gray-600" th:text="${#temporals.format(log.startedAt, 'MMM dd, yyyy')}">Date</span>
                                    </div>
                                </td>
                                <td class="px-8 py-6">
                                    <div class="inline-flex items-center px-2 py-1 bg-slate-100 rounded-lg text-xs font-black text-slate-600" th:text="${log.applicantsProcessed}">0</div>
                                </td>
                                <td class="px-8 py-6">
                                    <span th:class="'px-3 py-1 text-[10px] font-black uppercase rounded-full tracking-widest ' + 
                                        (${log.result == 'success'} ? 'bg-emerald-100 text-emerald-700' : 'bg-red-100 text-red-700')"
                                          th:text="${log.result}">Success</span>
                                </td>
                                <td class="px-8 py-6 text-[10px] text-gray-500 font-medium max-w-xs truncate" th:text="${log.notes}">Notes</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
