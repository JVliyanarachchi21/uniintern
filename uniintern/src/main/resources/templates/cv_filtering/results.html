<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{cv_filtering/fragments/layout :: head('Results')}"></head>
<body class="flex h-screen w-full bg-slate-50 overflow-hidden font-sans">
    <div th:replace="~{cv_filtering/fragments/layout :: main('ResultsList', ~{::content})}">
        <div th:fragment="content" class="space-y-10 animate-fade-in pb-20">
            <div class="mb-10 flex justify-between items-center">
                <div class="space-y-1">
                    <h2 class="text-4xl font-black text-slate-900 tracking-tight">Filtering Results</h2>
                    <p class="text-slate-500 font-bold text-lg">Detailed analysis and historical ranking data.</p>
                </div>
                <a th:href="@{${userRole == 'admin' ? '/admin/cv/run-filtering' : '/company/cv/run-filtering'}}" 
                   class="bg-indigo-600 hover:bg-indigo-700 text-white px-8 py-5 rounded-[2.2rem] font-black shadow-xl shadow-indigo-200 transition-all flex items-center transform hover:scale-105 active:scale-95 group">
                    <i class="bi bi-plus-lg mr-3 group-hover:rotate-90 transition-transform"></i> New Analysis Run
                </a>
            </div>

            <div class="bg-white rounded-[3rem] shadow-2xl shadow-slate-200/40 border border-gray-50 overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left">
                        <thead>
                            <tr class="bg-gray-50 border-b border-gray-100">
                                <th class="px-10 py-6 text-[10px] font-black text-slate-400 uppercase tracking-widest">Internship</th>
                                <th class="px-10 py-6 text-[10px] font-black text-slate-400 uppercase tracking-widest text-center">Run Date</th>
                                <th class="px-10 py-6 text-[10px] font-black text-slate-400 uppercase tracking-widest text-center">Applicants</th>
                                <th class="px-10 py-6 text-[10px] font-black text-slate-400 uppercase tracking-widest text-center">Status</th>
                                <th class="px-10 py-6 text-[10px] font-black text-slate-400 uppercase tracking-widest text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-100">
                            <tr th:if="${#lists.isEmpty(runs)}">
                                <td colspan="5" class="px-10 py-20 text-center text-slate-400 font-bold italic">
                                    No filtering results discovered. Start by running the engine.
                                </td>
                            </tr>
                            <tr th:each="run : ${runs}" class="hover:bg-slate-50/50 transition-colors group">
                                <td class="px-10 py-8">
                                    <div class="text-sm font-black text-slate-900" th:text="${run.internshipTitle}">Title</div>
                                    <div class="text-[10px] font-bold text-slate-400 uppercase mt-1 tracking-widest" th:text="${run.company}">Company</div>
                                </td>
                                <td class="px-10 py-8 text-center text-sm font-black text-slate-600" th:text="${#temporals.format(run.finishedAt, 'MMM dd, yyyy HH:mm')}">Date</td>
                                <td class="px-10 py-8 text-center">
                                    <span class="inline-flex items-center px-4 py-1.5 bg-slate-100 rounded-xl text-xs font-black text-slate-600 border border-slate-200 shadow-sm" th:text="${run.applicantsProcessed}">0</span>
                                </td>
                                <td class="px-10 py-8 text-center">
                                    <span th:class="'px-4 py-2 text-[10px] font-black uppercase rounded-full tracking-widest shadow-sm ' + 
                                        (${run.status == 'completed' || run.status == 'approved'} ? 'bg-emerald-50 text-emerald-700 border border-emerald-100' : 
                                        (${run.status == 'pending_approval'} ? 'bg-amber-100 text-amber-700 border border-amber-100' : 'bg-rose-50 text-rose-700 border border-rose-100'))"
                                          th:text="${run.status == 'pending_approval'} ? 'Awaiting Admin' : ${run.status}">
                                        Status
                                    </span>
                                </td>
                                <td class="px-10 py-8 text-right space-x-3">
                                    <a th:href="@{${userRole == 'admin' ? '/admin/cv/ranking-detail/' : '/company/cv/ranking-detail/'} + ${run.id}}" 
                                       class="inline-flex items-center px-6 py-3 bg-white border border-gray-100 rounded-2xl text-[10px] font-black text-slate-700 hover:bg-indigo-50 hover:border-indigo-200 hover:text-indigo-700 transition-all shadow-sm">
                                        <i class="bi bi-eye-fill mr-2"></i> Rankings
                                    </a>
                                    <a th:href="@{${userRole == 'admin' ? '/admin/cv/results/' : '/company/cv/results/'} + ${run.id} + '/download'}"
                                       class="w-12 h-12 inline-flex items-center justify-center bg-white border border-gray-100 rounded-2xl text-slate-400 hover:text-indigo-600 hover:border-indigo-200 transition-all shadow-sm"
                                       title="Download Report">
                                        <i class="bi bi-download"></i>
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
