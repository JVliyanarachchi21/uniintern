<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Apply | UniIntern</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body class="app">

<div th:replace="fragments/student-sidebar :: studentSidebar('internships')"></div>

<main class="main">

  <div th:replace="fragments/student-topbar :: studentTopbar(${fullName})"></div>

  <section class="content">
    <div class="page-title">
      <h1>Apply: <span th:text="${internship.title}">Internship</span></h1>
      <p>
        <span th:text="${internship.company}">Company</span> •
        <span th:text="${internship.location}">Location</span>
      </p>
    </div>

    <div class="panel">
      <div class="panel-title">Application Form</div>

      <form class="form">
        <div class="form-row">
          <label>GPA</label>
          <input type="number" step="0.01" min="0" max="4" placeholder="e.g., 3.25" required>
        </div>

        <div class="form-row">
          <label>Relevant Coursework</label>
          <input type="text" placeholder="e.g., Web Development, OOP, DBMS" required>
        </div>

        <div class="form-row">
          <label>Why are you interested?</label>
          <input type="text" placeholder="Short answer" required>
        </div>

        <div class="form-row">
          <label>Availability</label>
          <input type="text" placeholder="e.g., Immediate / From March" required>
        </div>

        <div class="form-row">
          <label>Upload Supporting Document (optional)</label>
          <input type="file" accept="application/pdf">
        </div>

        <div class="actions">
          <a class="btn" th:href="@{/student/internships}">Cancel</a>
          <button class="btn primary" type="button">Submit Application (UI)</button>
        </div>
      </form>
    </div>
  </section>
</main>

</body>
</html>
