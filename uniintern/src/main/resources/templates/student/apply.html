<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Apply for Internship | UniIntern</title>
  <link rel="stylesheet" th:href="@{/css/app.css(v=2)}">
  <link rel="stylesheet" th:href="@{/css/student-dashboard.css}">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --uni-primary: #052659;
      --uni-secondary: #0D8ABC;
      --uni-orange: #f59e0b;
      --uni-white: #FFFFFF;
      --uni-text: #0f172a;
      --border-soft: #e2e8f0;
      --bg-light: #f8fafc;
    }

    body {
        background-color: #f1f5f9;
        color: var(--uni-text);
        margin: 0;
    }

    .apply-shell {
        max-width: 900px;
        margin: 40px auto;
        padding: 0 20px;
    }

    .apply-card {
        background: white;
        border-radius: 24px;
        box-shadow: 0 20px 50px rgba(0,0,0,0.04);
        border: 1px solid var(--border-soft);
        overflow: hidden;
    }

    .apply-header {
        background: var(--bg-light);
        padding: 40px;
        border-bottom: 1px solid var(--border-soft);
    }

    .apply-header h1 {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-size: 32px;
        font-weight: 800;
        margin: 0 0 10px;
        color: var(--uni-primary);
        letter-spacing: -0.02em;
    }

    .apply-header .meta {
        font-size: 16px;
        color: #64748b;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .apply-body {
        padding: 40px;
    }

    .form-section-title {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-size: 14px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: #94a3b8;
        margin-bottom: 30px;
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .form-section-title::after {
        content: "";
        flex: 1;
        height: 1px;
        background: #f1f5f9;
    }

    .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px;
        margin-bottom: 32px;
    }

    .form-group {
        margin-bottom: 24px;
    }

    .form-group label {
        display: block;
        font-weight: 700;
        color: #334155;
        margin-bottom: 10px;
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.02em;
    }

    .form-group input, .form-group textarea {
        width: 100%;
        padding: 14px 18px;
        border-radius: 14px;
        border: 2px solid #f1f5f9;
        font-family: 'Inter', sans-serif;
        font-size: 15px;
        color: var(--uni-text);
        background: #fcfdfe;
        transition: all 0.2s ease;
    }

    .form-group input:focus, .form-group textarea:focus {
        outline: none;
        border-color: var(--uni-secondary);
        background: white;
        box-shadow: 0 0 0 4px rgba(13, 138, 188, 0.06);
    }

    .form-group textarea {
        min-height: 120px;
        resize: vertical;
    }

    .form-footer {
        display: flex;
        justify-content: flex-end;
        gap: 20px;
        padding-top: 32px;
        border-top: 1px solid #f1f5f9;
    }

    .btn-apply {
        padding: 14px 32px;
        border-radius: 14px;
        font-weight: 800;
        font-size: 15px;
        cursor: pointer;
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
    }

    .btn-apply.secondary {
        background: #f1f5f9;
        color: #64748b;
        border: none;
    }

    .btn-apply.secondary:hover {
        background: #e2e8f0;
        color: #475569;
    }

    .btn-apply.primary {
        background: var(--uni-orange);
        color: white;
        border: none;
        box-shadow: 0 8px 20px rgba(245, 158, 11, 0.2);
    }

    .btn-apply.primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 24px rgba(245, 158, 11, 0.3);
        filter: brightness(1.05);
    }

    /* Style for match mini-card if we want it */
    .match-preview {
        background: #f0fdf4;
        border: 1px solid #dcfce7;
        padding: 16px 20px;
        border-radius: 16px;
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 32px;
    }
    .match-val {
        font-weight: 800;
        color: #166534;
        font-size: 20px;
    }
    .match-text {
        font-size: 13px;
        color: #15803d;
        font-weight: 600;
        line-height: 1.3;
    }
  </style>
</head>

<body class="app">

<div th:replace="fragments/student-sidebar :: studentSidebar('internships')"></div>

<main class="main">

  <div th:replace="fragments/student-topbar :: studentTopbar(${fullName})"></div>

  <div class="apply-shell">
    <div class="apply-card">
      <div class="apply-header">
        <h1>Submit Application</h1>
        <div class="meta">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 21V5a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v5"></path></svg>
          <span th:text="${internship.title}">Data Science Intern</span>
          <span style="color: #cbd5e1;">•</span>
          <span th:text="${company != null ? company.companyName : 'Partner'}">TechLanka</span>
        </div>
      </div>

      <div class="apply-body">
        
        <form th:action="@{'/student/apply/' + ${internship.id}}" method="POST">
          
          <div class="form-section-title">Academic & Skills</div>

          <div class="form-grid">
              <div class="form-group">
                <label>GPA (Current or Final)</label>
                <input type="number" step="0.01" min="0" max="4" name="gpa" th:value="${student?.gpa}" placeholder="e.g., 3.25 / 4.0" required>
              </div>
              <div class="form-group">
                <label>Programming & Soft Skills</label>
                <input type="text" name="skills" th:value="${student?.skills}" placeholder="e.g., Java, SQL, Python, Agile" required>
              </div>
          </div>

          <div class="form-section-title">Career Background</div>

          <div class="form-group">
            <label>EXPERIENCE / PROJECTS</label>
            <textarea name="experience" th:text="${student?.experience}" placeholder="Briefly highlight 1-2 major projects or past roles..." required></textarea>
          </div>

          <div class="form-section-title">Submission Profile</div>

          <div class="form-group">
            <label>COVER LETTER / MOTIVATION STATEMENT</label>
            <textarea name="coverLetter" placeholder="Why are you the perfect match for this specific role? (2-3 sentences)" required></textarea>
          </div>

          <div class="form-footer">
            <a th:href="@{/student/internships}" class="btn-apply secondary">Cancel</a>
            <button type="submit" class="btn-apply primary">Submit Application</button>
          </div>

        </form>
      </div>
    </div>
  </div>

</main>

</body>
</html>
