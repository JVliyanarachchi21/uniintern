<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Apply | UniIntern</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo-dot"></div>
      <div class="brand-text">UniIntern</div>
    </div>

    <nav class="nav">
      <a class="nav-item" th:href="@{/student/dashboard}">Dashboard</a>
      <a class="nav-item" th:href="@{/student/profile}">My Profile</a>
      <a class="nav-item active" th:href="@{/student/internships}">Browse Internships</a>
      <a class="nav-item" href="#">My Applications</a>
      <a class="nav-item" href="#">Interviews</a>
      <a class="nav-item" href="#">Notifications</a>
      <a class="nav-item" href="#">Settings</a>
    </nav>

    <div class="sidebar-footer">
      <a class="nav-item logout" href="#">Logout</a>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div></div>
      <div class="topbar-right">
        <button class="icon-btn" title="Notifications">🔔</button>
        <div class="user">
          <div class="avatar">A</div>
          <div class="user-name">Ashan Perera</div>
          <div class="chev">▾</div>
        </div>
      </div>
    </header>

    <section class="content">
      <div class="page-title">
        <h1>Apply: <span th:text="${internship.title}">Internship</span></h1>
        <p>
          <span th:text="${internship.company}">Company</span> •
          <span th:text="${internship.location}">Location</span>
        </p>
      </div>

      <div class="panel">
        <div class="panel-title">Application Form</div>

        <form class="form">
          <div class="form-row">
            <label>GPA</label>
            <input type="number" step="0.01" min="0" max="4" placeholder="e.g., 3.25" required>
          </div>

          <div class="form-row">
            <label>Relevant Coursework</label>
            <input type="text" placeholder="e.g., Web Development, OOP, DBMS" required>
          </div>

          <div class="form-row">
            <label>Why are you interested?</label>
            <input type="text" placeholder="Short answer" required>
          </div>

          <div class="form-row">
            <label>Availability</label>
            <input type="text" placeholder="e.g., Immediate / From March" required>
          </div>

          <div class="form-row">
            <label>Upload Supporting Document (optional)</label>
            <input type="file" accept="application/pdf">
          </div>

          <div class="actions">
            <a class="btn" th:href="@{/student/internships}">Cancel</a>
            <button class="btn primary" type="button">Submit Application (UI)</button>
          </div>
        </form>
      </div>
    </section>
  </main>
</body>
</html>
