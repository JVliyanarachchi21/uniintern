<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Browse Internships | UniIntern</title>
  <link rel="stylesheet" th:href="@{/css/app.css(v=2)}">
  <link rel="stylesheet" th:href="@{/css/student-dashboard.css}">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
        --uni-primary: #052659;
        --uni-secondary: #0D8ABC;
        --uni-accent: #C1E8FF;
        --uni-soft: #F0F4F8;
    }
    .internship-card {
        background: white; 
        border: 1px solid #e2e8f0; 
        border-radius: 16px; 
        padding: 24px; 
        display: flex; 
        flex-direction: column; 
        gap: 16px; 
        transition: transform 0.2s, box-shadow 0.2s;
    }
    .internship-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 10px 25px rgba(0,0,0,0.05);
    }
    .btn-action {
        padding: 10px 20px;
        border-radius: 10px;
        font-weight: 700;
        font-size: 14px;
        cursor: pointer;
        transition: 0.2s;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
    }
    .btn-apply { background: var(--uni-primary); color: white; border: none; }
    .btn-details { background: #f1f5f9; color: #475569; border: 1px solid #e2e8f0; }
    .btn-applied { background: #f1f5f9; color: #94a3b8; border: 1px solid #e2e8f0; cursor: not-allowed; }
  </style>
</head>

<body class="app">

<div th:replace="fragments/student-sidebar :: studentSidebar('internships')"></div>

<main class="main">
  <div th:replace="fragments/student-topbar :: studentTopbar(${fullName})"></div>

  <section class="dashboard-page-container" style="padding: 40px;">
    
    <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 32px;">
      <div>
        <h1 style="font-family: 'Plus Jakarta Sans', sans-serif; font-size: 32px; font-weight: 800; color: #0f172a; margin: 0; letter-spacing: -0.02em;">Find Your Path</h1>
        <p style="color: #64748b; margin-top: 8px; font-size: 16px; font-weight: 500;">Explore filtered opportunities matched to your student profile.</p>
      </div>
    </div>

    <!-- Filters -->
    <div style="background: white; border: 1px solid #e2e8f0; border-radius: 16px; padding: 24px; margin-bottom: 32px; display: grid; grid-template-columns: 1fr 1fr 1.5fr 1fr; gap: 24px; box-shadow: 0 4px 6px rgba(0,0,0,0.02);">
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <label style="font-size: 13px; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 0.05em;">Location</label>
        <select style="width: 100%; padding: 12px; border: 1.5px solid #f1f5f9; border-radius: 10px; font-weight: 600;">
          <option>All Locations</option>
          <option>Colombo</option>
          <option>Kandy</option>
        </select>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <label style="font-size: 13px; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 0.05em;">Role Type</label>
        <select style="width: 100%; padding: 12px; border: 1.5px solid #f1f5f9; border-radius: 10px; font-weight: 600;">
          <option>All Roles</option>
          <option>Software</option>
          <option>Data Science</option>
        </select>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <label style="font-size: 13px; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 0.05em;">Search Keyword</label>
        <input type="text" placeholder="e.g. Java, Python..." style="width: 100%; padding: 12px; border: 1.5px solid #f1f5f9; border-radius: 10px; font-weight: 600;">
      </div>
      <div style="display: flex; align-items: flex-end;">
        <button style="width: 100%; height: 48px; background: #0f172a; color: white; border: none; border-radius: 10px; font-weight: 700; cursor: pointer;">Search</button>
      </div>
    </div>

    <!-- Results -->
    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(400px, 1fr)); gap: 24px;">
      
      <!-- Dynamic Internship Card -->
      <div class="internship-card" th:each="job : ${internships}">
        <div style="display: flex; justify-content: space-between; align-items: flex-start;">
          <div style="display: flex; gap: 16px; align-items: center;">
            <div style="width: 48px; height: 48px; background: #f8fafc; border-radius: 12px; display: flex; align-items: center; justify-content: center; border: 1px solid #f1f5f9; font-weight: 800; color: #cbd5e1;">Logo</div>
            <div>
              <h3 th:text="${job.title}" style="font-family: 'Plus Jakarta Sans', sans-serif; font-size: 18px; font-weight: 800; color: #0f172a; margin: 0;">Frontend Intern</h3>
              <p th:text="${job.company}" style="font-size: 14px; color: #64748b; margin: 4px 0 0; font-weight: 600;">Company Name</p>
            </div>
          </div>
          <div style="background: #f0fdf4; border: 1px solid #bbf7d0; color: #15803d; padding: 6px 12px; border-radius: 50px; font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 6px;">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
            <span th:text="${job.match} + '% Match'">85% Match</span>
          </div>
        </div>

        <div style="display: flex; flex-wrap: wrap; gap: 12px; font-size: 13px; color: #64748b; font-weight: 600;">
          <span style="display: flex; align-items: center; gap: 4px;"><svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg> <span th:text="${job.location}">Colombo</span></span>
          <span style="display: flex; align-items: center; gap: 4px;"><svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg> Deadline: <span th:text="${job.deadline}">2026-04-15</span></span>
        </div>

        <div style="display: flex; gap: 8px; flex-wrap: wrap;">
          <span th:each="skill : ${job.skills}" th:text="${skill}" style="background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; padding: 4px 12px; border-radius: 50px;">Skill</span>
        </div>

        <div style="display: flex; gap: 12px; margin-top: 8px;">
          <a th:href="@{'/student/apply/' + ${job.id}}" class="btn-action btn-apply" th:if="${!job.isApplied}" style="flex: 1;">Apply Now</a>
          <button class="btn-action btn-applied" th:if="${job.isApplied}" style="flex: 1;">Applied</button>
          
          <!-- NEW: View Details Button -->
          <a th:href="@{'/student/internships/' + ${job.id}}" class="btn-action btn-details" style="flex: 1;">View Details</a>
        </div>
      </div>

    </div>

  </section>
</main>

</body>
</html>
