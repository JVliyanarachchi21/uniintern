<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Browse Internships | UniIntern</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo-dot"></div>
      <div class="brand-text">UniIntern</div>
    </div>

    <nav class="nav">
      <a class="nav-item" th:href="@{/student/dashboard}">Dashboard</a>
      <a class="nav-item" th:href="@{/student/profile}">My Profile</a>
      <a class="nav-item" href="#">Browse Companies</a>
      <a class="nav-item active" th:href="@{/student/internships}">Browse Internships</a>
      <a class="nav-item" href="#">My Applications</a>
      <a class="nav-item" href="#">Interviews</a>
      <a class="nav-item" href="#">Notifications</a>
      <a class="nav-item" href="#">Settings</a>
    </nav>

    <div class="sidebar-footer">
      <a class="nav-item logout" href="#">Logout</a>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="page-title" style="margin:0;">
        <h1 style="margin:0;font-size:16px;">Browse Internships</h1>
      </div>
      <div class="topbar-right">
        <button class="icon-btn" title="Notifications">🔔</button>
        <div class="user">
          <div class="avatar">A</div>
          <div class="user-name">Ashan Perera</div>
          <div class="chev">▾</div>
        </div>
      </div>
    </header>

    <section class="content">

      <!-- Filters -->
      <div class="panel" style="margin-bottom:14px;">
        <div class="panel-title">Filters</div>

        <div class="filters">
          <div class="filter">
            <label>Location</label>
            <select>
              <option>All</option>
              <option>Colombo</option>
              <option>Kandy</option>
              <option>Galle</option>
              <option>Remote</option>
            </select>
          </div>

          <div class="filter">
            <label>Type</label>
            <select>
              <option>All</option>
              <option>Internship</option>
              <option>Trainee</option>
              <option>Part-time</option>
            </select>
          </div>

          <div class="filter">
            <label>Min Skill Match (%)</label>
            <input type="range" min="0" max="100" th:value="${matchMin}">
          </div>

          <div class="filter">
            <button class="btn primary" type="button">Apply Filters (UI)</button>
          </div>
        </div>
      </div>

      <!-- Cards -->
      <div class="intern-cards">
        <div class="intern-card" th:each="i : ${internships}">
          <div class="intern-card-head">
            <div>
              <div class="intern-card-title" th:text="${i.title}">Title</div>
              <div class="intern-card-sub">
                <span th:text="${i.company}">Company</span> •
                <span th:text="${i.location}">Location</span> •
                <span th:text="${i.duration}">Duration</span>
              </div>
            </div>

            <div class="match">
              <div class="match-label">Match</div>
              <div class="match-value"><span th:text="${i.match}">82</span>%</div>
            </div>
          </div>

          <div class="skill-row">
            <span class="chip" th:each="s : ${i.skills}" th:text="${s}">Skill</span>
          </div>

          <div class="intern-card-foot">
            <div class="muted">Deadline: <span th:text="${i.deadline}">2026-04-15</span></div>

            <a class="btn primary"
               th:href="@{'/student/apply/' + ${i.id}}">
              Apply
            </a>
          </div>
        </div>
      </div>

    </section>
  </main>
</body>
</html>
