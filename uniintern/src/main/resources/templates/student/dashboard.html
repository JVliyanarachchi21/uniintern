<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Student Dashboard</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body class="app">

<div th:replace="fragments/student-sidebar :: studentSidebar('dashboard')"></div>

<main class="main">

  <div th:replace="fragments/student-topbar :: studentTopbar(${studentName})"></div>

  <section class="content">

    <div class="page-title">
      <h1>Welcome back, <span th:text="${studentName}">Student</span>!</h1>
      <p>Your internship overview</p>
    </div>

    <div class="cards">
      <div class="card">
        <div class="card-label">Profile</div>
        <div class="card-value" th:text="${profileCompletion} + '%'">85%</div>
      </div>

      <div class="card">
        <div class="card-label">Applications</div>
        <div class="card-value" th:text="${activeApplications}">8</div>
      </div>

      <div class="card">
        <div class="card-label">Interviews</div>
        <div class="card-value" th:text="${interviews}">2</div>
      </div>

      <div class="card">
        <div class="card-label">Notifications</div>
        <div class="card-value" th:text="${notificationCount}">3</div>
      </div>
    </div>

  </section>
</main>

</body>
</html>
