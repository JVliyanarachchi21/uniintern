<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Application Detail | UniIntern</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body class="app">

<div th:replace="fragments/student-sidebar :: studentSidebar('applications')"></div>

<main class="main">

  <div th:replace="fragments/student-topbar :: studentTopbar(${fullName})"></div>

  <section class="content">
    <div class="page-title">
      <h1>Application #<span th:text="${applicationId}">101</span></h1>
      <p>
        <strong th:text="${title}">Internship</strong> •
        <span th:text="${company}">Company</span>
      </p>
    </div>

    <div class="grid-2">
      <div class="panel">
        <div class="panel-title">Summary</div>

        <div class="kv">
          <div class="k">Status</div>
          <div class="v">
            <span class="badge badge-green" th:text="${status}">SHORTLISTED</span>
          </div>

          <div class="k">Score</div>
          <div class="v"><strong th:text="${score}">82</strong></div>
        </div>

        <div class="actions" style="margin-top:14px;">
          <a class="btn" th:href="@{/student/applications}">Back</a>
        </div>
      </div>

      <div class="panel">
        <div class="panel-title">Status Timeline</div>

        <div class="timeline">
          <div class="t-item" th:each="t : ${timeline}">
            <div class="t-dot" th:classappend="${t.done} ? ' t-dot-done' : ''"></div>
            <div class="t-body">
              <div class="t-step" th:text="${t.step}">Applied</div>
              <div class="t-date" th:text="${t.date}">2026-02-14</div>
            </div>
          </div>
        </div>

        <small class="hint">UI phase: timeline updates will come from Admin + Scheduling module later.</small>
      </div>
    </div>
  </section>
</main>

</body>
</html>
