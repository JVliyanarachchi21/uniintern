<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>My Profile | UniIntern</title>
    <link rel="stylesheet" th:href="@{/css/app.css(v=2)}">
    <link rel="stylesheet" th:href="@{/css/student-profile.css}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .success-alert {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            color: #166534;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 600;
        }
        .file-upload-input {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
        }
        .desc-text {
            width: 100%;
            border: 1px solid var(--border-soft);
            border-radius: 8px;
            padding: 8px;
            font-family: inherit;
            margin-top: 8px;
        }
    </style>
</head>

<body class="app">

<div th:replace="fragments/student-sidebar :: studentSidebar('profile')"></div>

<main class="main">

    <div th:replace="fragments/student-topbar :: studentTopbar(${fullName})"></div>

    <section class="profile-page-container">
        
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
            <h1 class="profile-header-title" style="margin: 0;">My Profile</h1>
        </div>

        <div th:if="${success}" class="success-alert">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
            <span th:text="${success}">Profile Saved Successfully!</span>
        </div>

        <!-- Single Form for all profile updates -->
        <form th:action="@{/student/profile/update}" method="post" enctype="multipart/form-data" id="profileForm">
            
            <!-- Hidden inputs for complex list data -->
            <input type="hidden" name="skills" id="skillsInput" th:value="${student.skills}">
            <input type="hidden" name="experience" id="experienceInput" th:value="${student.experience}">
            <input type="hidden" name="certifications" id="certificationsInput" th:value="${student.certifications}">

            <!-- Basic Information Card -->
            <div class="profile-card">
                <div class="profile-card-header">
                    <svg class="profile-card-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    <h2 class="profile-card-title">Basic Information</h2>
                </div>
                
                <div class="profile-grid-2">
                    <div class="form-group">
                        <label class="form-label">Full Name</label>
                        <input type="text" name="fullName" th:value="${student.fullName}" class="form-input" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">University</label>
                        <input type="text" th:value="${student.university}" class="form-input" readonly style="background: #f1f5f9; color: #64748b;">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Degree Program</label>
                        <input type="text" name="degreeProgram" th:value="${student.degreeProgram}" class="form-input">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Registration #</label>
                        <input type="text" th:value="${student.registrationNumber}" class="form-input" readonly style="background: #f1f5f9; color: #64748b;">
                    </div>
                    <div class="form-group">
                        <label class="form-label">NIC Number</label>
                        <input type="text" th:value="${student.nicNumber}" class="form-input" readonly style="background: #f1f5f9; color: #64748b;">
                    </div>
                    <div class="form-group">
                        <label class="form-label">GPA (Current)</label>
                        <input type="number" step="0.01" name="gpa" th:value="${student.gpa}" class="form-input">
                    </div>
                </div>
            </div>

            <!-- Skills Card -->
            <div class="profile-card">
                <div class="profile-card-header">
                    <svg class="profile-card-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
                    <h2 class="profile-card-title">My Skills</h2>
                </div>
                
                <div class="skills-container" id="skillsList">
                    <!-- Loaded via JS -->
                </div>
                
                <div class="add-item-row">
                    <input type="text" id="newSkillInput" placeholder="Add a skill (e.g., Java)" class="form-input add-item-input">
                    <button type="button" class="btn-icon-add" onclick="addSkill()">
                        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    </button>
                </div>
            </div>

            <!-- Experience Card -->
            <div class="profile-card">
                <div class="profile-card-header">
                    <svg class="profile-card-icon" style="color: #F59E0B;" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>
                    <h2 class="profile-card-title">Experience</h2>
                </div>
                
                <div id="experienceList">
                    <!-- Loaded via JS -->
                </div>

                <div class="profile-grid-4" style="margin-top: 20px;">
                    <input type="text" id="expCompany" placeholder="Company" class="form-input">
                    <input type="text" id="expRole" placeholder="Role" class="form-input">
                    <input type="text" id="expDuration" placeholder="Duration (e.g. 3 months)" class="form-input">
                    <input type="text" id="expDesc" placeholder="Brief description" class="form-input">
                </div>

                <button type="button" class="btn-outline-add" onclick="addExperience()">
                    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    Add Experience
                </button>
            </div>

            <!-- Certifications Card -->
            <div class="profile-card">
                <div class="profile-card-header">
                    <svg class="profile-card-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
                    <h2 class="profile-card-title">Certifications</h2>
                </div>

                <div id="certificationsList">
                    <!-- Loaded via JS -->
                </div>

                <div class="add-item-row" style="margin-top: 16px;">
                    <input type="text" id="certTitle" placeholder="Certification Title" class="form-input add-item-input">
                    <input type="text" id="certYear" placeholder="Year" class="form-input" style="width: 100px; flex: none;">
                    <button type="button" class="btn-icon-add" onclick="addCertification()">
                        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    </button>
                </div>
            </div>

            <!-- CV Upload Card -->
            <div class="profile-card">
                <div class="profile-card-header">
                    <svg class="profile-card-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                    <h2 class="profile-card-title">CV Upload</h2>
                </div>
                
                <div class="file-upload-box">
                    <div class="file-upload-left">
                        <label for="cvFile" class="btn-file" style="cursor: pointer;">Choose File</label>
                        <input type="file" name="cvFile" id="cvFile" class="file-upload-input" onchange="updateFileName(this)">
                        <span class="file-status" id="fileStatus">
                            <span th:if="${student.cvFilePath == null}">No file selected</span>
                            <span th:if="${student.cvFilePath != null}" style="color: #16a34a; font-weight: 600;">CV Attached</span>
                        </span>
                    </div>
                    <span class="file-name" id="fileNameDisplay">
                        <span th:if="${student.cvFilePath == null}">Supports PDF only</span>
                        <a th:if="${student.cvFilePath != null}" 
                           th:href="${student.cvFilePath}" 
                           target="_blank" 
                           style="color: var(--color-primary); text-decoration: underline; font-weight: 600; cursor: pointer;">
                           Current CV Found (Click to View)
                        </a>
                    </span>
                    
                    <button th:if="${student.cvFilePath != null}" type="button" class="btn-icon-add" style="background:#fee2e2; border-color:#fca5a5;" onclick="clearFile()">
                        <svg width="16" height="16" fill="none" stroke="#ef4444" stroke-width="2" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                    </button>
                </div>
            </div>

            <!-- Save Profile Button -->
            <div style="display: flex; justify-content: flex-end; margin-top: 32px; padding-bottom: 40px;">
                <button type="submit" class="btn-save-profile">
                    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
                    Save My Profile
                </button>
            </div>

        </form>
    </section>

</main>

<script th:inline="javascript">
    // Data structures
    let skills = [];
    let experiences = [];
    let certifications = [];

    // Initialize from DB (if exists)
    try {
        const rawSkills = /*[[${student.skills}]]*/ '';
        if (rawSkills && rawSkills.trim() !== '') {
            skills = rawSkills.split(',').map(s => s.trim());
        }
        
        const rawExp = /*[[${student.experience}]]*/ '[]';
        if (rawExp && rawExp.trim() !== '' && rawExp !== 'null') {
            experiences = JSON.parse(rawExp);
        }

        const rawCert = /*[[${student.certifications}]]*/ '[]';
        if (rawCert && rawCert.trim() !== '' && rawCert !== 'null') {
            certifications = JSON.parse(rawCert);
        }
    } catch (e) {
        console.warn("Failed to parse profile data", e);
    }

    // --- Skills Management ---
    function renderSkills() {
        const container = document.getElementById('skillsList');
        container.innerHTML = '';
        skills.forEach((skill, index) => {
            const badge = document.createElement('span');
            badge.className = 'skill-badge';
            badge.innerHTML = `${skill} <svg class="skill-remove" onclick="removeSkill(${index})" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>`;
            container.appendChild(badge);
        });
        document.getElementById('skillsInput').value = skills.join(',');
    }

    function addSkill() {
        const input = document.getElementById('newSkillInput');
        const val = input.value.trim();
        if (val && !skills.includes(val)) {
            skills.push(val);
            input.value = '';
            renderSkills();
        }
    }

    function removeSkill(index) {
        skills.splice(index, 1);
        renderSkills();
    }

    // --- Experience Management ---
    function renderExperience() {
        const container = document.getElementById('experienceList');
        container.innerHTML = '';
        experiences.forEach((exp, index) => {
            const item = document.createElement('div');
            item.className = 'list-item';
            item.innerHTML = `
                <svg class="list-item-delete" onclick="removeExperience(${index})" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                <h3>${exp.role} at ${exp.company}</h3>
                <p class="meta">${exp.duration}</p>
                <p class="desc">${exp.desc}</p>
            `;
            container.appendChild(item);
        });
        document.getElementById('experienceInput').value = JSON.stringify(experiences);
    }

    function addExperience() {
        const company = document.getElementById('expCompany').value.trim();
        const role = document.getElementById('expRole').value.trim();
        const duration = document.getElementById('expDuration').value.trim();
        const desc = document.getElementById('expDesc').value.trim();

        if (company && role) {
            experiences.push({ company, role, duration, desc });
            document.getElementById('expCompany').value = '';
            document.getElementById('expRole').value = '';
            document.getElementById('expDuration').value = '';
            document.getElementById('expDesc').value = '';
            renderExperience();
        }
    }

    function removeExperience(index) {
        experiences.splice(index, 1);
        renderExperience();
    }

    // --- Certifications Management ---
    function renderCertifications() {
        const container = document.getElementById('certificationsList');
        container.innerHTML = '';
        certifications.forEach((cert, index) => {
            const item = document.createElement('div');
            item.className = 'cert-item';
            item.innerHTML = `
                <span>${cert.title} (${cert.year})</span>
                <svg class="skill-remove" onclick="removeCertification(${index})" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            `;
            container.appendChild(item);
        });
        document.getElementById('certificationsInput').value = JSON.stringify(certifications);
    }

    function addCertification() {
        const title = document.getElementById('certTitle').value.trim();
        const year = document.getElementById('certYear').value.trim();

        if (title) {
            certifications.push({ title, year });
            document.getElementById('certTitle').value = '';
            document.getElementById('certYear').value = '';
            renderCertifications();
        }
    }

    function removeCertification(index) {
        certifications.splice(index, 1);
        renderCertifications();
    }

    // --- Utility ---
    function updateFileName(input) {
        if (input.files && input.files[0]) {
            document.getElementById('fileNameDisplay').textContent = input.files[0].name;
            document.getElementById('fileStatus').innerHTML = '<span style="color: #16a34a; font-weight: 600;">File Ready</span>';
        }
    }

    function clearFile() {
        document.getElementById('cvFile').value = '';
        document.getElementById('fileNameDisplay').textContent = 'File cleared (Upload new one to replace)';
        document.getElementById('fileStatus').innerHTML = '<span>No file selected</span>';
    }

    // Initial render
    window.onload = () => {
        renderSkills();
        renderExperience();
        renderCertifications();
    };

    // Form validation before submit
    document.getElementById('profileForm').onsubmit = function() {
        // Sync one last time
        document.getElementById('skillsInput').value = skills.join(',');
        document.getElementById('experienceInput').value = JSON.stringify(experiences);
        document.getElementById('certificationsInput').value = JSON.stringify(certifications);
        return true;
    };
</script>

</body>
</html>
