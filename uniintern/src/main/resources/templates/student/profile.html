<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>My Profile | UniIntern</title>
  <link rel="stylesheet" th:href="@{/css/app.css(v=2)}">
  <link rel="stylesheet" th:href="@{/css/student-profile.css}">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body class="app">

<div th:replace="fragments/student-sidebar :: studentSidebar('profile')"></div>

<main class="main">

    <div th:replace="fragments/student-topbar :: studentTopbar(${fullName})"></div>

    <section class="profile-page-container">
        
        <h1 class="profile-header-title">My Profile</h1>

        <!-- Basic Information Card -->
        <div class="profile-card">
            <div class="profile-card-header">
                <svg class="profile-card-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                <h2 class="profile-card-title">Basic Information</h2>
            </div>
            
            <div class="profile-grid-2">
                <!-- Row 1 -->
                <div class="form-group">
                    <label class="form-label">Full Name</label>
                    <input type="text" th:value="${loggedInStudent?.fullName}" value="Student" class="form-input" readonly>
                </div>
                <div class="form-group">
                    <label class="form-label">University</label>
                    <input type="text" th:value="${loggedInStudent?.university}" value="University" class="form-input" readonly>
                </div>
                <!-- Row 2 -->
                <div class="form-group">
                    <label class="form-label">Degree</label>
                    <input type="text" th:value="${loggedInStudent?.degreeProgram}" value="Discipline" class="form-input" readonly>
                </div>
                <div class="form-group">
                    <label class="form-label">Registration #</label>
                    <input type="text" th:value="${loggedInStudent?.registrationNumber}" value="ID" class="form-input" readonly>
                </div>
                <!-- Row 3 -->
                <div class="form-group">
                    <label class="form-label">NIC</label>
                    <input type="text" th:value="${loggedInStudent?.nicNumber}" value="NIC" class="form-input" readonly>
                </div>
                <div class="form-group">
                    <label class="form-label">GPA</label>
                    <input type="text" th:value="${loggedInStudent?.gpa}" value="0.0" class="form-input" readonly>
                </div>
            </div>
        </div>

        <!-- Skills Card -->
        <div class="profile-card">
            <div class="profile-card-header">
                <svg class="profile-card-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
                <h2 class="profile-card-title">Skills <span>(6/15)</span></h2>
            </div>
            
            <div class="skills-container">
                <span class="skill-badge">
                    React <svg class="skill-remove" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </span>
                <span class="skill-badge">
                    TypeScript <svg class="skill-remove" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </span>
                <span class="skill-badge">
                    Python <svg class="skill-remove" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </span>
                <span class="skill-badge">
                    SQL <svg class="skill-remove" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </span>
                <span class="skill-badge">
                    Node.js <svg class="skill-remove" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </span>
                <span class="skill-badge">
                    Git <svg class="skill-remove" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </span>
            </div>
            
            <div class="add-item-row">
                <input type="text" placeholder="Add a skill" class="form-input add-item-input">
                <button type="button" class="btn-icon-add">
                    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                </button>
            </div>
        </div>

        <!-- Experience Card -->
        <div class="profile-card">
            <div class="profile-card-header">
                <svg class="profile-card-icon" style="color: #F59E0B;" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>
                <h2 class="profile-card-title">Experience</h2>
            </div>
            
            <!-- Existing Experience Item -->
            <div class="list-item">
                <svg class="list-item-delete" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                <h3>Frontend Intern at TechCorp Labs</h3>
                <p class="meta">3 months</p>
                <p class="desc">Built dashboard components using React and TypeScript.</p>
            </div>

            <!-- Add Experience Form -->
            <div class="profile-grid-4">
                <input type="text" placeholder="Company" class="form-input">
                <input type="text" placeholder="Role" class="form-input">
                <input type="text" placeholder="Duration" class="form-input">
                <input type="text" placeholder="Description" class="form-input">
            </div>

            <button type="button" class="btn-outline-add">
                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                Add Experience
            </button>
        </div>

        <!-- Certifications Card -->
        <div class="profile-card">
            <div class="profile-card-header">
                <svg class="profile-card-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
                <h2 class="profile-card-title">Certifications</h2>
            </div>

            <!-- Existing Cert -->
            <div class="cert-item">
                <span>AWS Cloud Practitioner (2025)</span>
                <svg class="skill-remove" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </div>

            <!-- Add Cert Form -->
            <div class="add-item-row">
                <input type="text" placeholder="Title" class="form-input add-item-input">
                <input type="text" placeholder="Year" class="form-input" style="width: 100px; flex: none;">
                <button type="button" class="btn-icon-add">
                    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                </button>
            </div>
        </div>

        <!-- CV Upload Card -->
        <div class="profile-card" style="margin-bottom: 0;">
            <div class="profile-card-header">
                <svg class="profile-card-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                <h2 class="profile-card-title">CV Upload</h2>
            </div>
            
            <div class="file-upload-box">
                <div class="file-upload-left">
                    <button type="button" class="btn-file">Choose File</button>
                    <span class="file-status">No file chosen</span>
                </div>
                <span class="file-name">Ashan_Perera_CV.pdf</span>
            </div>
        </div>

        <!-- Save Profile Button -->
        <div style="display: flex; justify-content: flex-end; margin-top: 32px;">
            <button type="submit" class="btn-save-profile">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
                Save Profile
            </button>
        </div>

    </section>

</main>

</body>
</html>
