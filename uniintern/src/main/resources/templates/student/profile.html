<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>My Profile | UniIntern</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body class="app">

<div th:replace="fragments/student-sidebar :: studentSidebar('profile')"></div>

<main class="main">

  <div th:replace="fragments/student-topbar :: studentTopbar(${fullName})"></div>

  <section class="content">
    <div class="page-title">
      <h1>My Profile</h1>
      <p>Update your details to improve internship matching.</p>
    </div>

    <div class="grid-2">
      <div class="panel">
        <div class="panel-title">Personal & Academic Details</div>

        <form class="form">
          <div class="form-row">
            <label>Full Name</label>
            <input type="text" th:value="${fullName}" required>
          </div>

          <div class="form-row">
            <label>Email</label>
            <input type="email" th:value="${email}" readonly>
          </div>

          <div class="form-row">
            <label>University</label>
            <input type="text" th:value="${university}" required>
          </div>

          <div class="form-row">
            <label>Degree</label>
            <input type="text" th:value="${degree}" required>
          </div>

          <div class="form-row">
            <label>Registration Number</label>
            <input type="text" th:value="${regNo}" required>
          </div>

          <div class="form-row">
            <label>NIC</label>
            <input type="text" th:value="${nic}" required>
          </div>

          <div class="form-row">
            <label>GPA</label>
            <input type="number" step="0.01" min="0" max="4" th:value="${gpa}" required>
            <small class="hint">Must be between 0.00 and 4.00</small>
          </div>

          <div class="actions">
            <button class="btn primary" type="button">Save Changes (UI)</button>
          </div>
        </form>
      </div>

      <div class="panel">
        <div class="panel-title">Skills & CV</div>

        <div class="block">
          <div class="block-title">Skills (max 15)</div>
          <div class="chips">
            <span class="chip" th:each="s : ${skills}" th:text="${s}">Java</span>
          </div>

          <div class="form-row" style="margin-top:10px;">
            <label>Add a skill</label>
            <input type="text" placeholder="e.g., React, AWS, Docker">
            <small class="hint">UI phase: tags will be saved later with DB integration.</small>
          </div>

          <button class="btn" type="button">Add Skill (UI)</button>
        </div>

        <hr class="sep" />

        <div class="block">
          <div class="block-title">Upload CV (PDF)</div>
          <input type="file" accept="application/pdf">
          <small class="hint">UI phase only — later we store file path + parse data.</small>
        </div>
      </div>
    </div>
  </section>
</main>

</body>
</html>
