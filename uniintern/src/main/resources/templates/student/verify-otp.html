<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Verify OTP | UniIntern</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body class="auth-body">

<div class="otp-shell">
    <div class="otp-card">
        <div class="brand-row center">
            <div class="brand-logo">U</div>
            <div class="brand-text dark">UniIntern</div>
        </div>

        <div class="otp-header">
            <h2>Verify your email</h2>
            <p>An OTP has been sent to</p>
            <div class="otp-email" th:text="${email}">student@university.edu</div>
        </div>

        <p class="field-error" th:if="${otpError}" th:text="${otpError}"></p>

        <form method="post" th:action="@{/student/verify-otp}" class="auth-form">
            <input type="hidden" name="email" th:value="${email}">

            <div class="form-group">
                <label for="otp">Enter OTP</label>
                <input id="otp"
                       type="text"
                       name="otp"
                       placeholder="Enter 6-digit code"
                       maxlength="6"
                       inputmode="numeric"
                       autocomplete="one-time-code"
                       required>
                <p class="live-hint" id="otpHint"></p>
            </div>

            <button type="submit" class="auth-btn">Verify and Continue</button>
        </form>

        <div class="otp-actions">
            <a href="#">Resend OTP</a>
            <span>•</span>
            <a th:href="@{/student/register}">Back to registration</a>
        </div>
    </div>
</div>

<script>
    const otpInput = document.getElementById("otp");
    const otpHint = document.getElementById("otpHint");

    otpInput.addEventListener("input", function () {
        const original = this.value;
        let cleaned = original.replace(/\D/g, "");

        if (original !== cleaned) {
            otpHint.textContent = "Only numbers are allowed.";
            otpHint.classList.add("show-hint");
        } else if (cleaned.length === 6) {
            otpHint.textContent = "";
            otpHint.classList.remove("show-hint");
        }

        if (cleaned.length > 6) {
            cleaned = cleaned.slice(0, 6);
            otpHint.textContent = "OTP must be exactly 6 digits.";
            otpHint.classList.add("show-hint");
        }

        this.value = cleaned;
    });

    otpInput.addEventListener("keypress", function (e) {
        if (!/[0-9]/.test(e.key)) {
            e.preventDefault();
            otpHint.textContent = "Only numbers are allowed.";
            otpHint.classList.add("show-hint");
            return;
        }

        if (this.value.length >= 6) {
            e.preventDefault();
            otpHint.textContent = "OTP must be exactly 6 digits.";
            otpHint.classList.add("show-hint");
        }
    });

    otpInput.addEventListener("paste", function (e) {
        e.preventDefault();
        const pasted = (e.clipboardData || window.clipboardData).getData("text");
        let cleaned = pasted.replace(/\D/g, "");

        if (pasted !== cleaned) {
            otpHint.textContent = "Only numbers are allowed.";
            otpHint.classList.add("show-hint");
        }

        if (cleaned.length > 6) {
            cleaned = cleaned.slice(0, 6);
            otpHint.textContent = "OTP must be exactly 6 digits.";
            otpHint.classList.add("show-hint");
        }

        this.value = cleaned;
    });

    otpInput.addEventListener("blur", function () {
        if (this.value.length === 6) {
            otpHint.textContent = "";
            otpHint.classList.remove("show-hint");
        }
    });
</script>

</body>
</html>
