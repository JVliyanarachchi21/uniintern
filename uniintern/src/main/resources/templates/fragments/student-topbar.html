<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="studentTopbar(studentName)">
  <header class="topbar">
    <div></div>
    <div class="topbar-right">
      <a th:href="@{/student/notifications}" class="notif-btn" title="Notifications" style="text-decoration: none; color: inherit; display: flex; align-items: center; justify-content: center;">
        <svg width="22" height="22" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path>
        </svg>
        <span class="notif-dot" th:if="${unreadNotifCount > 0}"></span>
      </a>
      
      <div class="user" onclick="this.classList.toggle('active')">
        <div class="user-avatar-group">
          <!-- Uses the hero-student.jpeg image for the student profile picture -->
          <img th:src="@{/images/hero-student.jpeg}" alt="Profile Picture" class="avatar" style="object-fit: cover; border: 2px solid var(--border-soft); box-sizing: border-box;">
          <div class="user-name" th:text="${studentName}">Student</div>
          <div class="chev">
            <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"></path></svg>
          </div>
        </div>

        <!-- Dropdown Menu -->
        <div class="user-dropdown">
          <a th:href="@{/student/profile}" class="dropdown-item">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
            My Profile
          </a>
          <a th:href="@{/student/settings}" class="dropdown-item">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
            Settings
          </a>
          <a th:href="@{/}" class="dropdown-item">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
            Logout
          </a>
        </div>
      </div>
      
      <!-- Script to handle clicking outside the dropdown to close it -->
      <script>
        document.addEventListener('click', function(event) {
          const userElement = document.querySelector('.user');
          if (userElement && !userElement.contains(event.target)) {
            userElement.classList.remove('active');
          }
        });
      </script>
      
    </div>
  </header>
</div>
</body>
</html>
