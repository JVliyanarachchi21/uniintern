<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | UniIntern</title>
    <link rel="stylesheet" th:href="@{/css/company-auth.css}">
</head>
<body>

<div class="auth-page">

    <div class="auth-left">
        <div class="auth-left-content-wrapper">
            <div class="brand-wrap">
                <img th:src="@{/images/logo.png}" src="/images/logo.png" class="brand-logo" alt="UniIntern Logo">
                <div class="brand-text-wrap">
                    <h1 class="brand-name">UniIntern</h1>
                    <p class="brand-tag">LAUNCH YOUR CAREER</p>
                </div>
            </div>
            <div class="hero-badge">Password Reset</div>
            <div class="auth-left-content">
                <h2>Create a strong new password</h2>
                <p>Your password should be at least 8 characters long and contain a mix of letters, numbers, and symbols.</p>
            </div>
        </div>
    </div>

    <div class="auth-right">
        <div class="auth-card">
            <div class="mini-logo-wrap">
                <img th:src="@{/images/logo.png}" src="/images/logo.png" class="mini-logo-img" alt="UniIntern Logo">
            </div>
            <h2>New Password</h2>
            <p class="auth-sub">Enter your new login credentials</p>

            <form th:action="@{/company/reset-password}" method="post">
                <div th:if="${error}" style="background: #fee2e2; color: #ef4444; padding: 10px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; font-weight: 500;">
                    <span th:text="${error}"></span>
                </div>
                
                <input type="hidden" name="email" th:value="${email}">
                <input type="hidden" name="otp" th:value="${otp}">
                
                <div class="field">
                    <label for="newPassword">New Password</label>
                    <div class="input-wrap" style="position: relative; display: flex; align-items: center;">
                        <span class="input-icon">🔒</span>
                        <input type="password" id="newPassword" name="newPassword" placeholder="Minimum 8 characters" required style="width: 100%; border: none; outline: none; background: transparent; font-size: 15px; color: var(--text-dark); padding-right: 40px;">
                        <span class="toggle-password" style="position: absolute; right: 15px; cursor: pointer; color: #64748b; display: flex; align-items: center; user-select: none;" title="Toggle Password Visibility">
                            <svg class="eye-icon hidden" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                            <svg class="eye-icon visible" style="display:none;" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </span>
                    </div>
                </div>

                <div class="field">
                    <label for="confirmPassword">Confirm Password</label>
                    <div class="input-wrap" style="position: relative; display: flex; align-items: center;">
                        <span class="input-icon">🔒</span>
                        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Repeat new password" required style="width: 100%; border: none; outline: none; background: transparent; font-size: 15px; color: var(--text-dark); padding-right: 40px;">
                        <span class="toggle-password" style="position: absolute; right: 15px; cursor: pointer; color: #64748b; display: flex; align-items: center; user-select: none;" title="Toggle Password Visibility">
                            <svg class="eye-icon hidden" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                            <svg class="eye-icon visible" style="display:none;" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </span>
                    </div>
                </div>

                <button type="submit" class="auth-btn">Change Password</button>
            </form>

            <div class="auth-links">
                <p><a th:href="@{/company/login}">← Back to Login</a></p>
            </div>
        </div>
    </div>

</div>

<script>
    document.querySelectorAll('.toggle-password').forEach(toggle => {
        toggle.addEventListener('click', function() {
            const inputWrap = this.closest('.input-wrap');
            const passwordInput = inputWrap.querySelector('input');
            const hiddenIcon = this.querySelector('.eye-icon.hidden');
            const visibleIcon = this.querySelector('.eye-icon.visible');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                hiddenIcon.style.display = 'none';
                visibleIcon.style.display = 'block';
            } else {
                passwordInput.type = 'password';
                hiddenIcon.style.display = 'block';
                visibleIcon.style.display = 'none';
            }
        });
    });
</script>
</body>
</html>
