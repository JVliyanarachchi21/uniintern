<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="company/layout/layout :: layout(
      pageTitle='My Internships',
      content=~{::body/content()})">

<body>
<section class="page-shell">

    <div class="internships-header">
        <div>
            <h1 class="page-title">My Internships</h1>
            <p class="page-sub">Manage your internship postings</p>
        </div>

        <a th:href="@{/company/internships/new}" class="btn primary">+ New Internship</a>
    </div>

    <div class="table-card internships-table-card">
        <table class="table internships-table">
            <thead>
            <tr>
                <th>Title</th>
                <th>Status</th>
                <th>Deadline</th>
                <th>Applicants</th>
                <th>Featured</th>
                <th class="actions-col">Actions</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="internship : ${internships}">
                <td class="internship-title" th:text="${internship.title}">Software Engineering Intern</td>

                <td>
                    <span class="badge-status"
                          th:classappend="${internship.status == 'Approved'} ? ' st-approved' :
                                          (${internship.status == 'Pending'} ? ' st-pending' :
                                          (${internship.status == 'Draft'} ? ' st-draft' :
                                          (${internship.status == 'Rejected'} ? ' st-rejected' : ' st-closed')))"
                          th:text="${internship.status}">
                        Approved
                    </span>
                </td>

                <td th:text="${internship.deadline}">2026-04-30</td>
                <td th:text="${internship.applicants}">12</td>

                <td>
                    <span class="featured-pill"
                          th:classappend="${internship.featured == 'Yes'} ? ' featured-yes' : ' featured-no'"
                          th:text="${internship.featured}">
                        Yes
                    </span>
                </td>

                <td>
                    <div class="icon-actions">
                        <button type="button" class="icon-btn" title="View" onclick="viewInternship()">👁</button>
                        <button type="button" class="icon-btn" title="Edit" onclick="editInternship()">✎</button>
                        <button type="button" class="icon-btn" title="Copy" onclick="copyInternship()">⧉</button>
                        <button type="button" class="icon-btn" title="Feature" onclick="featureInternship()">☆</button>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

</section>

<script src="/js/company.js"></script>
</body>
</html>
