<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="company/layout/layout :: layout(
        pageTitle='Payment Successful',
        content=~{::body/content()})">

<body>
<section class="page-shell" style="text-align: center; padding: 60px 20px;">

    <div class="success-container" style="max-width: 600px; margin: 0 auto; background: white; padding: 50px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.05); animation: slideUp 0.6s ease-out;">
        
        <div class="success-icon" style="width: 100px; height: 100px; background: linear-gradient(135deg, #10b981, #059669); color: white; line-height: 100px; font-size: 50px; border-radius: 50%; margin: 0 auto 30px; display: inline-block;">
            ✓
        </div>

        <h1 style="font-size: 32px; color: #1e293b; margin-bottom: 10px;">Payment Successful!</h1>
        <p style="color: #64748b; font-size: 18px; margin-bottom: 40px;">Your promotion is now active. Your internship will now be highlighted to attract more candidates.</p>

        <div class="receipt-summary" style="background: #f8fafc; border-radius: 12px; padding: 25px; text-align: left; margin-bottom: 40px;">
            <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                <span style="color: #94a3b8;">Internship:</span>
                <span style="font-weight: 600; color: #334155;" th:text="${internship.title}">Software Engineering Intern</span>
            </div>
            <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                <span style="color: #94a3b8;">Promotion Type:</span>
                <span style="font-weight: 600; color: #334155;" th:text="${promoType}">Featured (7 Days)</span>
            </div>
            <div style="display: flex; justify-content: space-between; padding-top: 10px; border-top: 1px dashed #cbd5e1;">
                <span style="color: #334155; font-weight: 700;">Transaction ID:</span>
                <span style="color: #10b981; font-weight: 700;">TXN-PROMO-99321</span>
            </div>
        </div>

        <div class="success-actions">
            <a href="/company/dashboard" class="btn primary" style="padding: 14px 40px; font-weight: 600;">Back to Dashboard</a>
            <br><br>
            <a href="/company/promotions" style="color: #6366f1; text-decoration: none; font-weight: 500;">Promote another internship</a>
        </div>
    </div>

</section>

<style>
    @keyframes slideUp {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>

</body>
</html>
