<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <style>
        body { font-family: 'Helvetica', 'Arial', sans-serif; color: #334155; margin: 40px; line-height: 1.6; }
        .header { border-bottom: 2px solid #3b82f6; padding-bottom: 20px; margin-bottom: 30px; text-align: center; }
        .company-name { font-size: 24px; font-weight: bold; color: #1e293b; margin-bottom: 5px; }
        .report-title { font-size: 18px; color: #3b82f6; margin-bottom: 10px; }
        .meta { font-size: 12px; color: #64748b; margin-bottom: 20px; }
        
        .internship-box { background: #f8fafc; border: 1px solid #e2e8f0; padding: 15px; border-radius: 8px; margin-bottom: 30px; }
        .internship-label { font-size: 12px; text-transform: uppercase; color: #64748b; margin-bottom: 5px; }
        .internship-title { font-size: 18px; font-weight: bold; color: #1e293b; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { background: #f1f5f9; color: #475569; text-align: left; padding: 12px; font-size: 13px; border-bottom: 1px solid #e2e8f0; }
        td { padding: 12px; font-size: 13px; border-bottom: 1px solid #f1f5f9; }
        .rank { font-weight: bold; color: #3b82f6; width: 40px; }
        .score { font-weight: 600; text-align: center; color: #10b981; }
        
        .footer { position: fixed; bottom: 0; left: 0; right: 0; text-align: center; font-size: 10px; color: #94a3b8; border-top: 1px solid #f1f5f9; padding-top: 10px; }
    </style>
</head>
<body>
    <div class="header">
        <div class="company-name" th:text="${companyName}">Company Name</div>
        <div class="report-title">Shortlisted Candidates Report</div>
        <div class="meta" th:text="'Generated on: ' + ${date}">Date: 2026-04-21</div>
    </div>

    <div class="internship-box">
        <div class="internship-label">Target Internship</div>
        <div class="internship-title" th:text="${internshipTitle}">Software Engineering Intern</div>
    </div>

    <table>
        <thead>
            <tr>
                <th class="rank">#</th>
                <th>Full Name</th>
                <th>University</th>
                <th style="text-align: center;">Score</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="a, iter : ${applicants}">
                <td class="rank" th:text="${iter.count}">1</td>
                <td th:text="${a.name}">Student Name</td>
                <td th:text="${a.university}">University Name</td>
                <td class="score" th:text="${a.score}">85</td>
            </tr>
            <tr th:if="${#lists.isEmpty(applicants)}">
                <td colspan="4" style="text-align: center; padding: 30px;">No qualified candidates found.</td>
            </tr>
        </tbody>
    </table>

    <div class="footer">
        Generated by UniIntern Portal - Talent Pool Management System
    </div>
</body>
</html>
