<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="company/layout/layout :: layout(
      pageTitle='Company Profile',
      content=~{::body/content()})">

<body>
<content>
    <section class="page-shell">
        <h1 class="page-title">Company Profile</h1>
        <p class="page-sub">Manage your company information and keep your profile up to date.</p>

        <div th:if="${successMessage}" class="profile-alert-success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="profile-alert-danger" th:text="${errorMessage}"></div>

        <form action="/company/profile/update" method="post" enctype="multipart/form-data">
            <div class="profile-layout">
                
                <!-- Left Sidebar -->
                <div class="profile-sidebar">
                    <div class="profile-card">
                        <div class="logo-preview-container">
                            <img id="logoPreview" th:src="${company.logoPath != null ? company.logoPath : 'https://ui-avatars.com/api/?name=Company&background=f8fafc&color=021024'}" onerror="this.src='https://ui-avatars.com/api/?name=Company'" alt="Company Logo" class="profile-logo">
                            <label for="logoFile" class="logo-upload-btn" title="Change Logo">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
                            </label>
                            <input type="file" id="logoFile" name="logoFile" accept="image/*" style="display: none;" onchange="previewLogo(event)">
                        </div>
                        
                        <h3 class="profile-company-name" th:text="${company.companyName}"></h3>
                        <p class="profile-company-industry" th:text="${company.industry}"></p>
                        
                        <div class="profile-quick-info">
                            <p>
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                                <span th:text="${company.email}"></span>
                            </p>
                            <p>
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
                                <span th:text="${company.phone}"></span>
                            </p>
                        </div>
                    </div>
                </div>

                <!-- Right Main Form -->
                <div class="profile-main-card">
                    <div class="section-title">Essential Details</div>

                    <div class="grid-2">
                        <div class="field">
                            <label for="companyName">Company Name</label>
                            <input type="text" id="companyName" name="companyName" th:value="${company.companyName}" required>
                        </div>

                        <div class="field">
                            <label for="industry">Industry</label>
                            <input type="text" id="industry" name="industry" th:value="${company.industry}" required>
                        </div>
                    </div>

                    <div class="grid-2">
                        <div class="field">
                            <label for="email">Contact Email</label>
                            <input type="email" id="email" name="email" th:value="${company.email}" required>
                        </div>

                        <div class="field">
                            <label for="phone">Phone Number</label>
                            <input type="text" id="phone" name="phone" th:value="${company.phone}" required>
                        </div>
                    </div>

                    <div class="grid-2">
                        <div class="field">
                            <label for="website">Website (Optional)</label>
                            <input type="text" id="website" name="website" th:value="${company.website}">
                        </div>

                        <div class="field">
                            <label for="address">HQ Address</label>
                            <input type="text" id="address" name="address" th:value="${company.address}" required>
                        </div>
                    </div>

                    <div class="section-title" style="margin-top: 30px;">About Company</div>

                    <div class="field">
                        <label for="description">Company Description / Bio</label>
                        <textarea id="description" name="description" th:text="${company.description}" required rows="5"></textarea>
                    </div>

                    <div style="margin-top: 32px; text-align: right;">
                        <button type="submit" class="btn-modern">Save Profile Changes</button>
                    </div>
                </div>

            </div>
        </form>
    </section>

    <script>
        function previewLogo(event) {
            const input = event.target;
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('logoPreview').src = e.target.result;
                }
                reader.readAsDataURL(input.files[0]);
            }
        }
    </script>
</content>

<script src="/js/company.js"></script>
</body>
</html>
