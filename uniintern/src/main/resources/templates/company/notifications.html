<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="company/layout/layout :: layout(
        pageTitle='Notifications',
        content=~{::body/content()})">

<body>
<section class="page-shell">

    <div class="notifications-page-header">
        <div>
            <h1 class="page-title">Notifications</h1>
            <p class="page-sub" th:text="${unreadCount + ' unread notifications'}">0 unread notifications</p>
        </div>
    </div>

    <div class="notifications-list">
        <div class="notification-card-item" th:each="n : ${notifications}">
            <div class="notification-card-icon">
                <i class="bi bi-bell"></i>
            </div>

            <div class="notification-card-content">
                <div class="notification-card-message" th:text="${n.message}">
                    Your internship has been approved.
                </div>
                <div class="notification-card-time" th:text="${n.date}">
                    2/24/2026, 10:30:00 AM
                </div>
            </div>
        </div>
    </div>

</section>
</body>
</html>
