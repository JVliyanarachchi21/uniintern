<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="company/layout/layout :: layout(
        pageTitle='Notifications',
        content=~{::body/content()})">

<body>
<section class="page-shell">

    <div class="notifications-page-header">
        <div>
            <h1 class="page-title">Notifications</h1>
            <p class="page-sub"><span th:text="${unreadCount}">0</span> unread notifications</p>

        </div>
    </div>

    <div class="notifications-list">
        <div class="notification-card-item" th:classappend="${n.type} + (${n.isNew} ? ' unread' : '')" th:each="n : ${notifications}">
            <div class="notification-card-icon">
                <i th:class="'bi ' + ${n.icon}"></i>
            </div>

            <div class="notification-card-content">
                <div class="notification-card-message">
                    <span th:text="${n.message}">Your internship has been approved.</span>
                    <span class="new-badge" th:if="${n.isNew}">New</span>
                </div>
                <div class="notification-card-time" th:text="${n.date}">
                    2/24/2026, 10:30:00 AM
                </div>
            </div>
        </div>
    </div>

</section>
</body>
</html>
