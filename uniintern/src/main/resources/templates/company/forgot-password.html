<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | UniIntern</title>
    <link rel="stylesheet" th:href="@{/css/company-auth.css}">
</head>
<body>

<div class="auth-page">

    <div class="auth-left">
        <div class="auth-left-content-wrapper">
            <div class="brand-wrap">
                <img th:src="@{/images/logo.png}" src="/images/logo.png" class="brand-logo" alt="UniIntern Logo">
                <div class="brand-text-wrap">
                    <h1 class="brand-name">UniIntern</h1>
                    <p class="brand-tag">LAUNCH YOUR CAREER</p>
                </div>
            </div>
            <div class="hero-badge">Password Recovery</div>
            <div class="auth-left-content">
                <h2>Don't worry, we'll help you get back in.</h2>
                <p>Enter the email address associated with your account and we'll send you an OTP to reset your password.</p>
            </div>
        </div>
    </div>

    <div class="auth-right">
        <div class="auth-card">
            <div class="mini-logo-wrap">
                <img th:src="@{/images/logo.png}" src="/images/logo.png" class="mini-logo-img" alt="UniIntern Logo">
            </div>
            <h2>Forgot Password</h2>
            <p class="auth-sub">Enter your email to receive a reset OTP</p>

            <form th:action="@{/company/forgot-password}" method="post">
                <div th:if="${error}" style="background: #fee2e2; color: #ef4444; padding: 10px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; font-weight: 500;">
                    <span th:text="${error}"></span>
                </div>
                
                <div class="field">
                    <label for="email">Email Address</label>
                    <div class="input-wrap">
                        <span class="input-icon">✉</span>
                        <input type="email" id="email" name="email" placeholder="hr@techcorp.lk" required>
                    </div>
                </div>

                <button type="submit" class="auth-btn">Send Reset OTP</button>
            </form>

            <div class="auth-links">
                <p><a th:href="@{/company/login}">← Back to Login</a></p>
            </div>
        </div>
    </div>

</div>
</body>
</html>
