<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filtering Results - UniIntern</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/cv_filtering/static/css/style.css}">
</head>
<body class="flex h-screen w-full bg-gray-100 font-sans">
    <div th:if="${userRole == 'admin'}" class="w-64 bg-gray-900 text-white flex flex-col h-full">
        <div class="p-6 border-b border-gray-700">
            <span class="font-bold text-xl">UniIntern Admin</span>
        </div>
        <nav class="flex-1 px-3 py-4 space-y-1">
            <a th:href="@{/admin/dashboard}" class="block px-3 py-2 rounded text-gray-300 hover:bg-gray-800">Home</a>
            <a th:href="@{/admin/cv/dashboard}" class="block px-3 py-2 rounded bg-gray-800 text-white">CV Filtering</a>
        </nav>
    </div>
    
    <div th:if="${userRole == 'company'}" class="w-64 bg-brand-800 text-white flex flex-col h-full">
        <div class="p-6 border-b border-brand-700">
            <span class="font-bold text-xl">UniIntern</span>
        </div>
        <nav class="flex-1 px-3 py-4 space-y-1">
            <a th:href="@{/company/dashboard}" class="block px-3 py-2 rounded text-brand-100 hover:bg-brand-700">Dashboard</a>
            <a th:href="@{/company/cv/dashboard}" class="block px-3 py-2 rounded bg-brand-700 text-white">CV Filtering</a>
        </nav>
    </div>
    
    <div class="flex-1 flex flex-col h-full overflow-hidden">
        <div th:replace="~{cv_filtering/fragments/layout :: header('Results')}"></div>
        <div th:replace="~{cv_filtering/fragments/layout :: submenuTabs('ResultsList')}"></div>
        
        <main class="flex-1 overflow-y-auto p-6">
            <div class="max-w-7xl mx-auto">
                <div class="mb-6">
                    <h2 class="text-2xl font-bold text-gray-900">Filtering Results</h2>
                    <p class="text-gray-500 mt-1">View all completed filtering runs</p>
                </div>
                
                <div th:if="${message}" class="mb-4 p-4 bg-green-50 border border-green-200 text-green-800 rounded-lg">
                    <span th:text="${message}"></span>
                </div>
                
                <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                    <table class="w-full text-sm text-left">
                        <thead class="text-xs text-gray-500 uppercase bg-gray-50">
                            <tr>
                                <th class="px-6 py-3">Internship</th>
                                <th class="px-6 py-3">Company</th>
                                <th class="px-6 py-3">Run Date</th>
                                <th class="px-6 py-3">Candidates</th>
                                <th class="px-6 py-3">Status</th>
                                <th class="px-6 py-3 text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-100">
                            <tr th:if="${#lists.isEmpty(runs)}">
                                <td colspan="6" class="px-6 py-8 text-center text-gray-500">
                                    No filtering runs found.
                                </td>
                            </tr>
                            <tr th:each="run : ${runs}" class="hover:bg-gray-50">
                                <td class="px-6 py-4">
                                    <div class="font-medium text-gray-900" th:text="${run.internshipTitle}">Title</div>
                                </td>
                                <td class="px-6 py-4 text-gray-600" th:text="${run.company}">Company</td>
                                <td class="px-6 py-4 text-gray-600" th:text="${#temporals.format(run.finishedAt, 'MMM dd, yyyy HH:mm')}">Date</td>
                                <td class="px-6 py-4 text-gray-600" th:text="${run.applicantsProcessed}">0</td>
                                <td class="px-6 py-4">
                                    <span class="px-2 py-1 text-xs font-medium rounded-full"
                                          th:classappend="${run.status == 'approved'} ? 'bg-green-100 text-green-800' :
                                                          (${run.status == 'pending_approval'} ? 'bg-yellow-100 text-yellow-800' :
                                                          (${run.status == 'rejected'} ? 'bg-red-100 text-red-800' : 'bg-gray-100 text-gray-800'))"
                                          th:text="${run.status == 'pending_approval'} ? 'Pending' : ${#strings.capitalize(run.status)}">Status</span>
                                </td>
                                <td class="px-6 py-4 text-right">
                                    <a th:href="${userRole == 'admin' ? '/admin/cv/ranking-detail/' + run.id : '/company/cv/ranking-detail/' + run.id}"
                                       class="text-brand-600 hover:text-brand-800 font-medium">
                                        View Rankings
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
