<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Schedule Interview - UniIntern</title>
  <link rel="stylesheet" th:href="@{/admin/css/admin.css}">

  <style>
    body{
      margin:0;
      background:#F3F4F6;
      font-family:Inter,Arial,sans-serif;
      color:#111827;
    }

    .schedule-shell{
      max-width:980px;
      margin:0 auto;
      padding:24px;
    }

    .schedule-back{
      display:inline-block;
      margin-bottom:16px;
      text-decoration:none;
      color:#052659;
      font-weight:800;
    }

    .schedule-hero{
      background:linear-gradient(135deg, #052659 0%, #5483B3 100%);
      color:#fff;
      border-radius:28px;
      padding:30px;
      box-shadow:0 20px 50px rgba(5,38,89,0.18);
      margin-bottom:22px;
      position:relative;
      overflow:hidden;
    }

    .schedule-kicker{
      display:inline-block;
      background:rgba(255,255,255,0.16);
      padding:8px 14px;
      border-radius:999px;
      font-size:13px;
      font-weight:700;
      margin-bottom:12px;
    }

    .schedule-hero h1{
      margin:0 0 10px 0;
      font-size:46px;
    }

    .schedule-hero p{
      margin:0;
      color:rgba(255,255,255,0.9);
    }

    .schedule-card{
      background:#fff;
      border-radius:24px;
      padding:28px;
      box-shadow:0 16px 40px rgba(2,16,36,0.08);
    }

    .schedule-alert{
      display:none;
    }

    .schedule-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:18px;
    }

    .schedule-field{
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    .schedule-field-full{
      grid-column:1 / -1;
    }

    .schedule-label{
      font-weight:800;
      font-size:14px;
    }

    .schedule-input{
      border:1px solid #D1D5DB;
      background:#F9FAFB;
      border-radius:16px;
      padding:15px;
      font-size:15px;
      outline:none;
      transition:0.2s ease;
    }

    .schedule-input:focus{
      border-color:#5483B3;
      background:#fff;
      box-shadow:0 0 0 4px rgba(84,131,179,0.12);
    }

    .schedule-input.error{
      border-color:#DC2626;
      background:#FEF2F2;
      box-shadow:0 0 0 4px rgba(220,38,38,0.10);
    }

    .schedule-actions{
      display:flex;
      gap:12px;
      margin-top:24px;
    }

    .schedule-btn{
      border:none;
      border-radius:16px;
      padding:14px 22px;
      font-weight:800;
      cursor:pointer;
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      font-size:15px;
    }

    .schedule-btn-primary{
      background:linear-gradient(135deg, #10B981, #059669);
      color:#fff;
    }

    .schedule-btn-secondary{
      background:#F3F4F6;
      border:1px solid #E5E7EB;
      color:#111827;
    }

    .popup-overlay{
      position:fixed;
      inset:0;
      background:rgba(17,24,39,0.45);
      display:none;
      align-items:center;
      justify-content:center;
      z-index:9999;
      padding:20px;
    }

    .popup-overlay.show{
      display:flex;
    }

    .popup-box{
      width:100%;
      max-width:380px;
      background:#fff;
      border-radius:22px;
      padding:24px;
      box-shadow:0 25px 60px rgba(2,16,36,0.28);
      text-align:center;
    }

    .popup-icon{
      width:56px;
      height:56px;
      margin:0 auto 14px;
      border-radius:50%;
      background:#FEF2F2;
      color:#DC2626;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:28px;
      font-weight:900;
    }

    .popup-title{
      margin:0 0 8px;
      font-size:22px;
      font-weight:900;
      color:#111827;
    }

    .popup-message{
      margin:0 0 18px;
      color:#4B5563;
      line-height:1.6;
      font-size:15px;
    }

    .popup-btn{
      border:none;
      border-radius:14px;
      padding:12px 20px;
      background:linear-gradient(135deg, #052659, #5483B3);
      color:#fff;
      font-weight:800;
      cursor:pointer;
      min-width:110px;
    }

    @media (max-width: 760px){
      .schedule-grid{
        grid-template-columns:1fr;
      }

      .schedule-hero h1{
        font-size:36px;
      }
    }
  </style>
</head>

<body>

<div class="schedule-shell">

  <a href="/admin/scheduling" class="schedule-back">← Back</a>

  <div class="schedule-hero">
    <div class="schedule-kicker">Interview Management</div>
    <h1>Schedule Interview</h1>
    <p>Schedule interviews only for approved internships.</p>
  </div>

  <div class="schedule-card">

    <div th:if="${formError}" class="schedule-alert" th:text="${formError}"></div>

    <form th:action="@{/admin/schedule}" method="post" novalidate>

      <div class="schedule-grid">

        <div class="schedule-field">
          <label class="schedule-label">Candidate Name</label>
          <input
            id="candidateName"
            class="schedule-input"
            type="text"
            name="candidateName"
            th:value="${candidateName}"
            maxlength="80"
            autocomplete="off"
            placeholder="Enter candidate name">
        </div>

        <div class="schedule-field">
          <label class="schedule-label">Approved Internship</label>
          <select id="internshipId" class="schedule-input" name="internshipId">
            <option value="">Select approved internship</option>
            <option th:each="internship : ${approvedInternships}"
                    th:value="${internship.id}"
                    th:text="${internship.title}"
                    th:selected="${internship.id == internshipId}">
            </option>
          </select>
        </div>

        <div class="schedule-field schedule-field-full">
          <label class="schedule-label">Interview Date & Time</label>
          <input
            id="datetimeInput"
            class="schedule-input"
            type="datetime-local"
            name="datetime"
            th:value="${datetime}">
        </div>

      </div>

      <div class="schedule-actions">
        <button type="submit" class="schedule-btn schedule-btn-primary">Schedule</button>
        <a href="/admin/scheduling" class="schedule-btn schedule-btn-secondary">Back</a>
      </div>

    </form>

  </div>

</div>

<div id="validationPopup" class="popup-overlay">
  <div class="popup-box">
    <div class="popup-icon">!</div>
    <h3 class="popup-title">Invalid Input</h3>
    <p id="popupMessage" class="popup-message">Please enter valid data.</p>
    <button type="button" class="popup-btn" onclick="closePopup()">OK</button>
  </div>
</div>

<script>
  function setMinDateTime() {
    const input = document.getElementById("datetimeInput");
    const now = new Date();
    now.setMinutes(now.getMinutes() + 5);

    const y = now.getFullYear();
    const m = String(now.getMonth() + 1).padStart(2,'0');
    const d = String(now.getDate()).padStart(2,'0');
    const h = String(now.getHours()).padStart(2,'0');
    const min = String(now.getMinutes()).padStart(2,'0');

    input.min = `${y}-${m}-${d}T${h}:${min}`;
  }

  const popup = document.getElementById("validationPopup");
  const popupMessage = document.getElementById("popupMessage");

  function showPopup(message) {
    popupMessage.textContent = message;
    popup.classList.add("show");
  }

  function closePopup() {
    popup.classList.remove("show");
  }

  popup.addEventListener("click", function(e) {
    if (e.target === popup) {
      closePopup();
    }
  });

  const candidateInput = document.getElementById("candidateName");

  let candidatePopupShown = false;

  candidateInput.addEventListener("input", function () {
    const original = this.value;
    const cleaned = original.replace(/[^A-Za-z ]/g, "").replace(/\s{2,}/g, " ");

    if (original !== cleaned) {
      this.value = cleaned;
      this.classList.add("error");

      if (!candidatePopupShown) {
        showPopup("Candidate name can contain letters and spaces only. Numbers and special characters are not allowed.");
        candidatePopupShown = true;
      }
    } else {
      this.classList.remove("error");
      candidatePopupShown = false;
    }
  });

  setMinDateTime();

  const backendPopupFlag = /*[[${showPopup}]]*/ false;
  if (backendPopupFlag === true) {
    showPopup("Invalid input detected. Please correct the fields and try again.");
  }
</script>

</body>
</html>
