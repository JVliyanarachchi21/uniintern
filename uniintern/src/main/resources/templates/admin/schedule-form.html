<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Schedule Interview - UniIntern</title>
  <link rel="stylesheet" th:href="@{/admin/css/admin.css}">

  <style>
    body{
      margin:0;
      background:#F3F4F6;
      font-family:Inter,Arial,sans-serif;
      color:#111827;
    }

    .schedule-shell{
      max-width:980px;
      margin:0 auto;
      padding:24px;
    }

    .schedule-back{
      display:inline-block;
      margin-bottom:16px;
      text-decoration:none;
      color:#052659;
      font-weight:800;
    }

    .schedule-hero{
      background:linear-gradient(135deg, #052659 0%, #5483B3 100%);
      color:#fff;
      border-radius:28px;
      padding:30px;
      box-shadow:0 20px 50px rgba(5,38,89,0.18);
      margin-bottom:22px;
      position:relative;
      overflow:hidden;
    }

    .schedule-kicker{
      display:inline-block;
      background:rgba(255,255,255,0.16);
      padding:8px 14px;
      border-radius:999px;
      font-size:13px;
      font-weight:700;
      margin-bottom:12px;
    }

    .schedule-hero h1{
      margin:0 0 10px 0;
      font-size:46px;
    }

    .schedule-hero p{
      margin:0;
      color:rgba(255,255,255,0.9);
    }

    .schedule-card{
      background:#fff;
      border-radius:24px;
      padding:28px;
      box-shadow:0 16px 40px rgba(2,16,36,0.08);
    }

    .schedule-alert{
      margin-bottom:18px;
      background:#FEF2F2;
      border:1px solid #FECACA;
      color:#B91C1C;
      border-radius:16px;
      padding:14px;
      font-weight:700;
    }

    .schedule-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:18px;
    }

    .schedule-field{
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    .schedule-field-full{
      grid-column:1 / -1;
    }

    .schedule-label{
      font-weight:800;
      font-size:14px;
    }

    .schedule-input{
      border:1px solid #D1D5DB;
      background:#F9FAFB;
      border-radius:16px;
      padding:15px;
      font-size:15px;
      outline:none;
    }

    .schedule-input.error{
      border-color:#DC2626;
      background:#FEF2F2;
    }

    .schedule-error{
      font-size:13px;
      color:#DC2626;
      font-weight:700;
    }

    .schedule-actions{
      display:flex;
      gap:12px;
      margin-top:24px;
    }

    .schedule-btn{
      border:none;
      border-radius:16px;
      padding:14px 22px;
      font-weight:800;
      cursor:pointer;
    }

    .schedule-btn-primary{
      background:linear-gradient(135deg, #10B981, #059669);
      color:#fff;
    }

    .schedule-btn-secondary{
      background:#F3F4F6;
      border:1px solid #E5E7EB;
    }
  </style>
</head>

<body>

<div class="schedule-shell">

  <a href="/admin/scheduling" class="schedule-back">← Back</a>

  <div class="schedule-hero">
    <div class="schedule-kicker">Interview Management</div>
    <h1>Schedule Interview</h1>
    <p>Real validation + restricted inputs + future-only time.</p>
  </div>

  <div class="schedule-card">

    <div th:if="${formError}" class="schedule-alert" th:text="${formError}"></div>

    <form th:action="@{/admin/schedule}" method="post" novalidate>

      <div class="schedule-grid">

        <div class="schedule-field">
          <label class="schedule-label">Candidate Name</label>
          <input
            class="schedule-input"
            th:classappend="${candidateNameError} ? ' error' : ''"
            type="text"
            name="candidateName"
            th:value="${candidateName}"
            maxlength="80"
            oninput="this.value = this.value.replace(/[^A-Za-z ]/g,'').replace(/\s{2,}/g,' ')">
          <div class="schedule-error" th:if="${candidateNameError}" th:text="${candidateNameError}"></div>
        </div>

        <div class="schedule-field">
          <label class="schedule-label">Internship Title</label>
          <input
            class="schedule-input"
            th:classappend="${internshipTitleError} ? ' error' : ''"
            type="text"
            name="internshipTitle"
            th:value="${internshipTitle}"
            maxlength="120"
            oninput="this.value = this.value.replace(/[^A-Za-z0-9 .,&()/-]/g,'')">
          <div class="schedule-error" th:if="${internshipTitleError}" th:text="${internshipTitleError}"></div>
        </div>

        <div class="schedule-field schedule-field-full">
          <label class="schedule-label">Interview Date & Time</label>
          <input
            id="datetimeInput"
            class="schedule-input"
            th:classappend="${datetimeError} ? ' error' : ''"
            type="datetime-local"
            name="datetime"
            th:value="${datetime}">
          <div class="schedule-error" th:if="${datetimeError}" th:text="${datetimeError}"></div>
        </div>

      </div>

      <div class="schedule-actions">
        <button type="submit" class="schedule-btn schedule-btn-primary">Schedule</button>
        <a href="/admin/scheduling" class="schedule-btn schedule-btn-secondary">Back</a>
      </div>

    </form>

  </div>

</div>

<script>
  function setMinDateTime() {
    const input = document.getElementById("datetimeInput");

    const now = new Date();
    now.setMinutes(now.getMinutes() + 5);

    const y = now.getFullYear();
    const m = String(now.getMonth() + 1).padStart(2,'0');
    const d = String(now.getDate()).padStart(2,'0');
    const h = String(now.getHours()).padStart(2,'0');
    const min = String(now.getMinutes()).padStart(2,'0');

    input.min = `${y}-${m}-${d}T${h}:${min}`;
  }

  setMinDateTime();
</script>

</body>
</html>
