<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <style>
        @page { margin: 1cm; }
        body { font-family: 'Helvetica', 'Arial', sans-serif; font-size: 11pt; color: #333; line-height: 1.4; }
        .header { border-bottom: 2px solid #052659; padding-bottom: 15px; margin-bottom: 30px; }
        .header-title { font-size: 24pt; font-weight: bold; color: #052659; }
        .header-subtitle { font-size: 10pt; color: #666; margin-top: 5px; }
        .report-info { float: right; text-align: right; font-size: 9pt; color: #888; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { background-color: #f8fafc; border-bottom: 2px solid #e2e8f0; padding: 10px; text-align: left; font-weight: bold; font-size: 10pt; color: #475569; }
        td { border-bottom: 1px solid #f1f5f9; padding: 10px; font-size: 10pt; }
        .status { padding: 3px 8px; border-radius: 99px; font-size: 8pt; font-weight: bold; text-transform: uppercase; }
        .status-verified { background-color: #dcfce7; color: #166534; }
        .status-pending { background-color: #fef9c3; color: #854d0e; }
        .status-rejected { background-color: #fee2e2; color: #991b1b; }
        .footer { position: fixed; bottom: 0; width: 100%; text-align: center; font-size: 8pt; color: #999; padding-top: 10px; border-top: 1px solid #eee; }
    </style>
</head>
<body>
    <div class="header">
        <div class="report-info">
            Generated on: <span th:text="${#temporals.format(generatedOn, 'dd MMM yyyy HH:mm')}"></span><br/>
            Portal: UniIntern Admin Hub
        </div>
        <div class="header-title">UniIntern Official Report</div>
        <div class="header-subtitle">Internship Approval Report</div>
    </div>

    <div class="table-container">
        <h3>Internship Opportunities</h3>
        <table>
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Location</th>
                    <th>Min GPA</th>
                    <th>Deadline</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="internship : ${internships}">
                    <td th:text="${internship.title}">Title</td>
                    <td th:text="${internship.location}">Location</td>
                    <td th:text="${internship.minGpa}">Min GPA</td>
                    <td th:text="${#temporals.format(internship.deadline, 'dd MMM yyyy')}">Deadline</td>
                    <td>
                        <span class="status" 
                              th:classappend="${internship.status == 'APPROVED' ? 'status-verified' : (internship.status == 'REJECTED' ? 'status-rejected' : 'status-pending')}"
                              th:text="${internship.status}">
                            STATUS
                        </span>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="footer">
        UniIntern Management System - Confidential Institutional Document
    </div>
</body>
</html>
