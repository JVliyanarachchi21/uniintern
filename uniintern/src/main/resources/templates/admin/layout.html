<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content, pageTitle, active)">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title th:text="${pageTitle} ?: 'Admin - UniIntern'">Admin - UniIntern</title>
  <link rel="stylesheet" th:href="@{/admin/css/admin.css}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body>

<div class="app">

  <aside class="sidebar">
    <div class="brand">
      <img th:src="@{/images/logooo.png}" alt="UniIntern Logo" style="width: 46px; height: auto; border-radius: 4px; margin-right: 8px;">
      <span class="brand-text">UniIntern</span>
    </div>

    <nav class="nav">
      <a th:href="@{/admin/dashboard}" th:classappend="${active=='dashboard'} ? 'active' : ''">Dashboard</a>
      <a th:href="@{/admin/companies}" th:classappend="${active=='companies'} ? 'active' : ''">Company Approvals</a>
      <a th:href="@{/admin/companies/all}" th:classappend="${active=='companies-all'} ? 'active' : ''">Company History</a>
      <a th:href="@{/admin/internships}" th:classappend="${active=='internships'} ? 'active' : ''">Internship Approvals</a>
      <a th:href="@{/admin/internships/all}" th:classappend="${active=='internships-all'} ? 'active' : ''">Internship History</a>
      <a th:href="@{/admin/scheduling}" th:classappend="${active=='scheduling'} ? 'active' : ''">Interview Scheduling</a>
      <a th:href="@{/admin/reports}" th:classappend="${active=='reports'} ? 'active' : ''">System Reports</a>
      <a th:href="@{/admin/audit}" th:classappend="${active=='audit'} ? 'active' : ''">Audit Logs</a>
      <a th:href="@{/admin/settings}" th:classappend="${active=='settings'} ? 'active' : ''">Settings</a>
    </nav>

    <div class="logout">
      <a th:href="@{/}">Logout</a>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="top-right">
        <a th:href="@{/admin/notifications}" class="notification-link">
            <i class="bi bi-bell"></i>
            <span class="badge">2</span>
        </a>

        <div class="profile-dropdown">
            <button type="button" class="profile-trigger" id="adminProfileBtn">
                <span class="profile-avatar" style="background:var(--primary);">A</span>
                <span class="profile-name">Admin</span>
                <i class="bi bi-chevron-down profile-arrow"></i>
            </button>

            <div id="adminProfileMenu" class="profile-menu">
                <a th:href="@{/admin/settings}">
                    <i class="bi bi-person"></i>
                    <span>Admin Profile</span>
                </a>

                <a th:href="@{/admin/settings}">
                    <i class="bi bi-gear"></i>
                    <span>Settings</span>
                </a>

                <div class="profile-menu-divider"></div>

                <a th:href="@{/}" class="logout-link">
                    <i class="bi bi-box-arrow-right"></i>
                    <span>Logout</span>
                </a>
            </div>
        </div>
      </div>
    </header>

    <section class="content">
      <div th:replace="${content}"></div>
    </section>
  </main>

</div>

<!-- Floating Chatbot -->
<button class="chatbot-trigger" id="chatbotTrigger" title="AI Assistant">
  M
</button>

<div class="chatbot-window" id="chatbotWindow">
  <div class="chatbot-header">
    <h3>M.A.I.A - Admin Assistant</h3>
    <button class="chatbot-close" id="chatbotClose">&times;</button>
  </div>
  <div class="chatbot-body" id="chatbotBody">
    <div class="chat-bubble ai">Hello Admin! I am M.A.I.A. How can I help you manage the portal today?</div>
  </div>
  <div class="chatbot-footer">
    <button class="chatbot-mic" id="chatbotMic" title="Speak to M.A.I.A">🎤</button>
    <input type="text" class="chatbot-input" id="chatbotInput" placeholder="Ask me something...">
    <button class="chatbot-send" id="chatbotSend">&rarr;</button>
  </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    // Topbar Profile
    const btn = document.getElementById('adminProfileBtn');
    const menu = document.getElementById('adminProfileMenu');
    if (btn && menu) {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        menu.classList.toggle('show');
      });
      document.addEventListener('click', (e) => {
        if (!menu.contains(e.target) && !btn.contains(e.target)) {
          menu.classList.remove('show');
        }
      });
    }

    // Chatbot Logic
    const trigger = document.getElementById('chatbotTrigger');
    const win = document.getElementById('chatbotWindow');
    const closeBtn = document.getElementById('chatbotClose');
    const chatBody = document.getElementById('chatbotBody');
    const input = document.getElementById('chatbotInput');
    const sendBtn = document.getElementById('chatbotSend');
    const micBtn = document.getElementById('chatbotMic');

    if (trigger && win) {
      trigger.addEventListener('click', () => {
        win.classList.add('show');
      });
      closeBtn.addEventListener('click', () => {
        win.classList.remove('show');
      });

      function addBubble(text, sender) {
        const bubble = document.createElement('div');
        bubble.classList.add('chat-bubble', sender);
        bubble.textContent = text;
        chatBody.appendChild(bubble);
        chatBody.scrollTop = chatBody.scrollHeight;
        return bubble;
      }

      function speak(text) {
        if (!window.speechSynthesis) return;
        // Stop any current speaking before starting new
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = 1.0;
        utterance.pitch = 1.1;
        window.speechSynthesis.speak(utterance);
      }

      function handleSend() {
        const query = input.value.trim();
        if (!query) return;

        addBubble(query, 'user');
        input.value = '';

        const aiBubble = addBubble('', 'ai');
        
        // SSE Streaming
        const eventSource = new EventSource('/admin/chat/stream?q=' + encodeURIComponent(query));
        
        let fullResponseText = "";
        eventSource.onmessage = function(e) {
          aiBubble.textContent += e.data + " ";
          fullResponseText += e.data + " ";
          chatBody.scrollTop = chatBody.scrollHeight;
        };

        eventSource.onerror = function(e) {
          eventSource.close();
          // Speak the final joined text
          if (fullResponseText.trim()) {
            speak(fullResponseText.trim());
          }
        };
      }

      // Voice (STT) Logic
      if (micBtn) {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
          const recognition = new SpeechRecognition();
          recognition.continuous = false;
          recognition.interimResults = false;
          recognition.lang = 'en-US';

          recognition.onstart = () => {
            micBtn.classList.add('recording');
          };

          let finalTranscript = "";
          recognition.interimResults = true;

          recognition.onresult = (event) => {
            let interimTranscript = "";
            for (let i = event.resultIndex; i < event.results.length; ++i) {
                if (event.results[i].isFinal) {
                    finalTranscript += event.results[i][0].transcript;
                } else {
                    interimTranscript += event.results[i][0].transcript;
                }
            }
            input.value = finalTranscript || interimTranscript;
          };

          recognition.onend = () => {
            micBtn.classList.remove('recording');
            if (finalTranscript.trim().length > 0) {
                handleSend();
                finalTranscript = ""; // Clear for next time
            }
          };

          micBtn.addEventListener('click', () => {
            if (window.speechSynthesis) window.speechSynthesis.cancel();

            if (micBtn.classList.contains('recording')) {
              recognition.stop();
            } else {
              finalTranscript = ""; 
              input.value = "";
              recognition.start();
            }
          });
        } else {
          micBtn.style.display = 'none';
        }
      }

      sendBtn.addEventListener('click', handleSend);
      input.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') handleSend();
      });
    }
  });
</script>

</body>
</html>
