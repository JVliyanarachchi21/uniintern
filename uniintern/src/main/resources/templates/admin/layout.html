<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content, pageTitle, active)">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title th:text="${pageTitle} ?: 'Admin - UniIntern'">Admin - UniIntern</title>
  <link rel="stylesheet" th:href="@{/admin/css/admin.css}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body>

<div class="app">

  <aside class="sidebar">
    <div class="brand">
      <img th:src="@{/images/logooo.png}" alt="UniIntern Logo" style="width: 46px; height: auto; border-radius: 4px; margin-right: 8px;">
      <span class="brand-text">UniIntern</span>
    </div>

    <nav class="nav">
      <a th:href="@{/admin/dashboard}" th:classappend="${active=='dashboard'} ? 'active' : ''">Dashboard</a>
      <a th:href="@{/admin/companies}" th:classappend="${active=='companies'} ? 'active' : ''">Company Approvals</a>
      <a th:href="@{/admin/companies/all}" th:classappend="${active=='companies-all'} ? 'active' : ''">Company History</a>
      <a th:href="@{/admin/internships}" th:classappend="${active=='internships'} ? 'active' : ''">Internship Approvals</a>
      <a th:href="@{/admin/internships/all}" th:classappend="${active=='internships-all'} ? 'active' : ''">Internship History</a>
      <a th:href="@{/admin/scheduling}" th:classappend="${active=='scheduling'} ? 'active' : ''">Interview Scheduling</a>
      <a th:href="@{/admin/reports}" th:classappend="${active=='reports'} ? 'active' : ''">System Reports</a>
      <a th:href="@{/admin/audit}" th:classappend="${active=='audit'} ? 'active' : ''">Audit Logs</a>
      <a th:href="@{/admin/settings}" th:classappend="${active=='settings'} ? 'active' : ''">Settings</a>
    </nav>

    <div class="logout">
      <a th:href="@{/}">Logout</a>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="top-right">
        <a th:href="@{/admin/notifications}" class="notification-link">
            <i class="bi bi-bell"></i>
            <span class="badge">2</span>
        </a>

        <div class="profile-dropdown">
            <button type="button" class="profile-trigger" id="adminProfileBtn">
                <span class="profile-avatar" style="background:var(--primary);">A</span>
                <span class="profile-name">Admin</span>
                <i class="bi bi-chevron-down profile-arrow"></i>
            </button>

            <div id="adminProfileMenu" class="profile-menu">
                <a th:href="@{/admin/settings}">
                    <i class="bi bi-person"></i>
                    <span>Admin Profile</span>
                </a>

                <a th:href="@{/admin/settings}">
                    <i class="bi bi-gear"></i>
                    <span>Settings</span>
                </a>

                <div class="profile-menu-divider"></div>

                <a th:href="@{/}" class="logout-link">
                    <i class="bi bi-box-arrow-right"></i>
                    <span>Logout</span>
                </a>
            </div>
        </div>
      </div>
    </header>

    <section class="content">
      <div th:replace="${content}"></div>
    </section>
  </main>

</div>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const btn = document.getElementById('adminProfileBtn');
    const menu = document.getElementById('adminProfileMenu');
    if (btn && menu) {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        menu.classList.toggle('show');
      });
      document.addEventListener('click', (e) => {
        if (!menu.contains(e.target) && !btn.contains(e.target)) {
          menu.classList.remove('show');
        }
      });
    }
  });
</script>

</body>
</html>
