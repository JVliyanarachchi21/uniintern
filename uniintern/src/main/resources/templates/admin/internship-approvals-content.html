<div xmlns:th="http://www.thymeleaf.org" th:fragment="content">

  <h1 class="title">Internship Approvals</h1>
  <p class="subtitle">Approve or reject internships posted by companies.</p>

  <div class="panel">
    <table class="table">
      <thead>
        <tr>
          <th>Title</th>
          <th>Location</th>
          <th>Min GPA</th>
          <th>Deadline</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>

      <tbody>
        <tr th:if="${#lists.isEmpty(internships)}">
          <td colspan="6" style="color:#6B7280;">No pending internships.</td>
        </tr>

        <tr th:each="i : ${internships}">
          <td th:text="${i.title}">Title</td>
          <td th:text="${i.location}">Location</td>
          <td th:text="${i.minGpa}">Min GPA</td>
          <td th:text="${i.deadline}">Deadline</td>
          <td><span class="badge badge-pending">Pending</span></td>

          <td style="display:flex;gap:8px;flex-wrap:wrap;">
            <a th:href="@{|/admin/internships/${i.id}/approve|}" class="btn btn-approve">Approve</a>
            <a th:href="@{|/admin/internships/${i.id}/reject|}" class="btn btn-reject">Reject</a>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

</div>
