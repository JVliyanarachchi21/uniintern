<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login - UniIntern</title>

  <style>
    :root{
      --navy:#052659;
      --orange:#5483B3;
      --white:#FFFFFF;
      --text:#021024;
      --muted:#5483B3;
      --danger:#DC2626;
      --brand-lightest:#C1E8FF;
      --brand-light:#7DA0CA;
    }

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      min-height:100vh;
      font-family:Inter,Arial,sans-serif;
      background:
        radial-gradient(circle at top left, rgba(193,232,255,0.92), rgba(125,160,202,0.72) 35%, rgba(5,38,89,0.96) 100%);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      color:var(--text);
    }

    .login-card{
      background:rgba(255,255,255,0.96);
      border:1px solid rgba(255,255,255,0.55);
      border-radius:32px;
      padding:34px;
      box-shadow:0 24px 60px rgba(2,16,36,0.16);
      backdrop-filter:blur(16px);

      max-width:420px;
      width:100%;
    }

    .kicker{
      display:inline-block;
      background:var(--brand-lightest);
      color:var(--navy);
      border:1px solid var(--brand-light);
      border-radius:999px;
      padding:8px 14px;
      font-size:13px;
      font-weight:800;
      margin-bottom:14px;
    }

    .login-card h2{
      margin:0 0 10px;
      font-size:32px;
      color:var(--navy);
    }

    .subtitle{
      margin:0 0 20px;
      color:var(--muted);
    }

    .alert{
      margin-bottom:18px;
      background:#FEF2F2;
      border:1px solid #FECACA;
      color:#B91C1C;
      border-radius:16px;
      padding:14px 16px;
      font-size:14px;
      font-weight:700;
    }

    .field{
      display:flex;
      flex-direction:column;
      gap:8px;
      margin-bottom:18px;
    }

    .label{
      font-size:14px;
      font-weight:800;
    }

    .input{
      border:1px solid #D1D5DB;
      background:#F9FAFB;
      border-radius:16px;
      padding:14px;
      font-size:15px;
      outline:none;
    }

    .input:focus{
      border-color:#5483B3;
      background:#fff;
      box-shadow:0 0 0 4px rgba(84,131,179,0.16);
    }

    .input.error{
      border-color:var(--danger);
      background:#FEF2F2;
    }

    .field-error{
      font-size:13px;
      color:var(--danger);
      font-weight:700;
    }

    .help{
      font-size:13px;
      color:var(--muted);
    }

    .actions{
      display:flex;
      gap:12px;
      margin-top:10px;
    }

    .btn{
      border:none;
      border-radius:16px;
      padding:14px 20px;
      font-weight:800;
      cursor:pointer;
      text-decoration:none;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .btn-primary{
      background:linear-gradient(135deg, var(--navy), var(--orange));
      color:#fff;
      flex:1;
    }

    .btn-secondary{
      background:#F3F4F6;
      border:1px solid #E5E7EB;
      color:#111827;
    }


  </style>
</head>

<body>

  <div class="login-card">
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px;">
      <div style="background: #052659; width: 56px; height: 56px; display: flex; align-items: center; justify-content: center; border-radius: 14px; box-shadow: 0 8px 25px rgba(5,38,89,0.15);">
        <img src="/images/logo.png" th:src="@{/images/logo.png}" alt="UniIntern Logo" style="width: 42px; height: auto;">
      </div>
      <div class="kicker" style="margin-bottom: 0; background: rgba(5, 38, 89, 0.05); border-color: rgba(5, 38, 89, 0.1);">Admin Console</div>
    </div>

    <h2 style="font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; letter-spacing: -0.03em;">Sign In</h2>
    <p class="subtitle" style="font-size: 14px; font-weight: 500; opacity: 0.8;">Secure authorization for UniIntern administrators</p>

    <div th:if="${formError}" class="alert" th:text="${formError}"></div>
    <div th:if="${logoutMessage}" class="alert alert-success" style="background:#DCFCE7; color:#166534; padding:16px; border-radius:12px; margin-bottom:20px; border:1px solid #BBF7D0;" th:text="${logoutMessage}"></div>

    <form th:action="@{/admin/login}" method="post">

      <div class="field">
        <label class="label">Administrative Email</label>
        <div style="position: relative;">
          <input class="input" style="padding-left: 44px; width: 100%;" type="text" name="email" placeholder="admin@uniintern.com" required>
          <svg style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #94a3b8;" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"></path></svg>
        </div>
      </div>

      <div class="field">
        <label class="label">Password</label>
        <div style="position: relative;">
          <input class="input" style="padding-left: 44px; width: 100%;" type="password" name="password" placeholder="••••••••" required>
          <svg style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #94a3b8;" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0110 0v4"></path></svg>
        </div>
      </div>

      <div class="actions" style="margin-top: 30px;">
        <button type="submit" class="btn btn-primary" style="font-size: 15px; letter-spacing: -0.01em;">
          Access Dashboard
          <svg style="margin-left: 8px;" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3"></path></svg>
        </button>
      </div>

      <div style="text-align: center; margin-top: 24px;">
        <a href="/" style="font-size: 13px; font-weight: 700; color: #64748b; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; transition: color 0.2s;">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"></path></svg>
          Return to Home
        </a>
      </div>

    </form>
  </div>

</body>
</html>
