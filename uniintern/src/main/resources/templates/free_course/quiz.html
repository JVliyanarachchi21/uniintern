<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="'Quiz - ' + ${courseTitle} + ' | UniIntern'">Quiz | UniIntern</title>
  <link rel="stylesheet" th:href="@{/css/app.css(v=2)}">
  <link rel="stylesheet" th:href="@{/css/student-dashboard.css}">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .quiz-option {
      width: 100%;
      text-align: left;
      padding: 1rem;
      border-radius: 0.75rem;
      border: 2px solid var(--border-color);
      background: white;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 1rem;
      cursor: pointer;
    }
    .quiz-option:hover {
      border-color: var(--primary);
      background: var(--bg-secondary);
    }
    .quiz-option.selected {
      border-color: var(--primary);
      background: #eff6ff;
    }
    .quiz-option .option-icon {
      flex-shrink: 0;
      color: var(--text-muted);
    }
    .quiz-option.selected .option-icon {
      color: var(--primary);
    }
    .quiz-option .option-text {
      color: var(--text-primary);
      font-size: 1rem;
    }
    .quiz-option.selected .option-text {
      font-weight: 500;
      color: var(--primary-dark);
    }
    .progress-dot {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 500;
      transition: all 0.2s;
      border: 2px solid transparent;
    }
    .progress-dot.current {
      background: var(--primary);
      color: white;
    }
    .progress-dot.answered {
      background: #dbeafe;
      color: var(--primary);
      border-color: var(--primary-light);
    }
    .progress-dot.pending {
      background: var(--bg-secondary);
      color: var(--text-muted);
    }
    .progress-dot:hover {
      transform: scale(1.1);
    }
  </style>
</head>

<body class="app">

<div th:replace="fragments/student-sidebar :: studentSidebar('courses')"></div>

<main class="main dashboard-main-content">
  <div th:replace="fragments/student-topbar :: studentTopbar(${userName})"></div>

  <section class="dashboard-page-container">
    
    <div class="dashboard-greeting">
      <a th:href="@{/student/courses/view/{id}(id=${courseId})}" class="btn-dashboard btn-outline" style="margin-bottom: 1rem; display: inline-flex;">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" /></svg>
        Back to Course
      </a>
      <h1 th:text="${courseTitle} + ' - Final Quiz'">Course Quiz</h1>
      <p>Test your knowledge with this comprehensive quiz. You need 45% to pass.</p>
    </div>

    <!-- Quiz Container -->
    <div class="panel-card">
      <!-- Progress Header -->
      <div style="padding: 1.5rem; border-bottom: 1px solid var(--border-color);">
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem;">
          <span style="font-weight: 600; color: var(--text-primary);">Question <span id="current-question">1</span> of <span id="total-questions">20</span></span>
          <span style="color: var(--text-secondary); font-size: 0.875rem;">Select an answer to continue</span>
        </div>
        <div style="width: 100%; background: var(--bg-secondary); border-radius: 9999px; height: 8px; overflow: hidden;">
          <div id="progress-bar" style="background: var(--primary); height: 100%; width: 5%; transition: width 0.3s;"></div>
        </div>
        <!-- Question Navigation Dots -->
        <div style="display: flex; justify-content: center; gap: 0.5rem; margin-top: 1rem; flex-wrap: wrap;" id="question-dots"></div>
      </div>

      <!-- Question Content -->
      <div style="padding: 2rem;">
        <h2 id="question-text" style="font-size: 1.25rem; font-weight: 600; color: var(--text-primary); margin-bottom: 1.5rem; line-height: 1.5;">
          Loading question...
        </h2>

        <div id="options-container" style="display: flex; flex-direction: column; gap: 0.75rem; margin-bottom: 1.5rem;">
          <!-- Options will be generated by JavaScript -->
        </div>

        <div id="error-message" style="display: none; align-items: center; gap: 0.5rem; color: #dc2626; font-size: 0.875rem; font-weight: 500; margin-bottom: 1rem; background: #fef2f2; padding: 0.75rem; border-radius: 0.5rem;">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" style="width: 16px; height: 16px;"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 3.75h.008v.008H12v-.008Z" /></svg>
          Please select an answer before proceeding.
        </div>

        <div style="display: flex; justify-content: space-between; border-top: 1px solid var(--border-color); padding-top: 1.5rem;">
          <button id="prev-btn" onclick="previousQuestion()" class="btn-dashboard btn-outline" disabled>
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" /></svg>
            Previous
          </button>
          <button id="next-btn" onclick="nextQuestion()" class="btn-dashboard btn-primary">
            <span id="next-btn-text">Next Question</span>
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" id="next-icon"><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3" /></svg>
          </button>
        </div>
      </div>
    </div>

  </section>
</main>

<script th:inline="javascript">
  lucide.createIcons();

  // Quiz data passed from server
  const quizData = /*[[${quizData}]]*/ [];
  const courseId = /*[[${courseId}]]*/ '';

  let currentIndex = 0;
  let answers = new Array(quizData.length).fill(-1);

  function renderQuestion() {
    const question = quizData[currentIndex];
    document.getElementById('question-text').textContent = question.text;
    document.getElementById('current-question').textContent = currentIndex + 1;

    // Update progress bar
    const progress = ((currentIndex + 1) / quizData.length) * 100;
    document.getElementById('progress-bar').style.width = progress + '%';

    // Render options
    const optionsContainer = document.getElementById('options-container');
    optionsContainer.innerHTML = '';

    question.options.forEach((option, idx) => {
      const isSelected = answers[currentIndex] === idx;
      const button = document.createElement('button');
      button.className = 'quiz-option' + (isSelected ? ' selected' : '');
      button.onclick = () => selectOption(idx);

      button.innerHTML = `
        <div class="option-icon">
          ${isSelected 
            ? '<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" style="width: 24px; height: 24px;"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" /></svg>'
            : '<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" style="width: 24px; height: 24px;"><path stroke-linecap="round" stroke-linejoin="round" d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18Z" /></svg>'
          }
        </div>
        <span class="option-text">${option}</span>
      `;
      optionsContainer.appendChild(button);
    });

    // Update navigation buttons
    document.getElementById('prev-btn').disabled = currentIndex === 0;
    document.getElementById('next-btn-text').textContent = currentIndex === quizData.length - 1 ? 'Submit Quiz' : 'Next Question';

    if (currentIndex === quizData.length - 1) {
      document.getElementById('next-icon').style.display = 'none';
    } else {
      document.getElementById('next-icon').style.display = 'inline';
    }

    // Update dots
    renderDots();

    // Hide error
    document.getElementById('error-message').style.display = 'none';
  }

  function renderDots() {
    const dotsContainer = document.getElementById('question-dots');
    dotsContainer.innerHTML = '';

    quizData.forEach((_, index) => {
      const isAnswered = answers[index] !== -1;
      const isCurrent = index === currentIndex;

      const dot = document.createElement('button');
      dot.className = 'progress-dot ' + (isCurrent ? 'current' : (isAnswered ? 'answered' : 'pending'));
      dot.textContent = index + 1;
      dot.onclick = () => jumpToQuestion(index);
      dotsContainer.appendChild(dot);
    });
  }

  function selectOption(optionIndex) {
    answers[currentIndex] = optionIndex;
    renderQuestion();
  }

  function nextQuestion() {
    if (answers[currentIndex] === -1) {
      document.getElementById('error-message').style.display = 'flex';
      return;
    }

    if (currentIndex === quizData.length - 1) {
      submitQuiz();
    } else {
      currentIndex++;
      renderQuestion();
    }
  }

  function previousQuestion() {
    if (currentIndex > 0) {
      currentIndex--;
      renderQuestion();
    }
  }

  function jumpToQuestion(index) {
    currentIndex = index;
    renderQuestion();
  }

  function submitQuiz() {
    // Calculate results
    let correctCount = 0;
    answers.forEach((answer, index) => {
      if (answer === quizData[index].correctIndex) {
        correctCount++;
      }
    });

    const score = Math.round((correctCount / quizData.length) * 100);
    const incorrectCount = quizData.length - correctCount;
    const passed = score >= 45;

    let grade;
    if (score >= 90) grade = 'A';
    else if (score >= 80) grade = 'B';
    else if (score >= 70) grade = 'B-';
    else if (score >= 60) grade = 'C';
    else if (score >= 45) grade = 'Pass';
    else grade = 'F';

    // Submit form
    const form = document.createElement('form');
    form.method = 'POST';
    form.action = '/student/courses/results';

    const fields = {
      courseId: courseId,
      score: score,
      correctCount: correctCount,
      incorrectCount: incorrectCount,
      grade: grade,
      passed: passed
    };

    for (const [key, value] of Object.entries(fields)) {
      const input = document.createElement('input');
      input.type = 'hidden';
      input.name = key;
      input.value = value;
      form.appendChild(input);
    }

    document.body.appendChild(form);
    form.submit();
  }

  // Initialize
  document.getElementById('total-questions').textContent = quizData.length;
  renderQuestion();
</script>

</body>
</html>
