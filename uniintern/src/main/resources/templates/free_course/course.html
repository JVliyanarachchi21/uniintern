<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${courseTitle} + ' | UniIntern'">Course | UniIntern</title>
  <link rel="stylesheet" th:href="@{/css/app.css(v=2)}">
  <link rel="stylesheet" th:href="@{/css/student-dashboard.css}">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="app">

<div th:replace="fragments/student-sidebar :: studentSidebar('courses')"></div>

<main class="main dashboard-main-content">
  <div th:replace="fragments/student-topbar :: studentTopbar(${userName})"></div>

  <section class="dashboard-page-container">
    
    <div class="dashboard-greeting">
      <a th:href="@{/student/courses/dashboard}" class="btn-dashboard btn-outline" style="margin-bottom: 1rem; display: inline-flex;">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" /></svg>
        Back to Courses
      </a>
      <h1 th:text="${courseTitle}">Course Title</h1>
      <p th:text="${courseDescription}">Course description goes here.</p>
    </div>

    <!-- Video Player -->
    <div class="panel-card" style="padding: 0; overflow: hidden;">
      <div style="position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; background: #000;">
        <iframe
          style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;"
          th:src="'https://www.youtube.com/embed/' + ${youtubeId} + '?rel=0'"
          th:title="${courseTitle}"
          frameborder="0"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen>
        </iframe>
      </div>
    </div>

    <!-- Quiz Section -->
    <div class="panel-card">
      <div class="panel-header">
        <svg class="panel-icon icon-trend" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h3.75M9 15h3.75M9 18h3.75m3 .75H18a2.25 2.25 0 0 0 2.25-2.25V6.108c0-1.135-.845-2.098-1.976-2.192a48.424 48.424 0 0 0-1.123-.08m-5.801 0c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 0 0 .75-.75 2.25 2.25 0 0 0-.1-.664m-5.8 0A2.251 2.251 0 0 1 13.5 2.25H15c1.012 0 1.867.668 2.15 1.586m-5.8 0c-.376.023-.75.05-1.124.08C9.095 4.01 8.25 4.973 8.25 6.108V19.5a2.25 2.25 0 0 0 2.25 2.25h.75m0-3H12" />
        </svg>
        <h2>Course Quiz</h2>
      </div>
      <div style="padding: 1.5rem;">
        <div id="timer-section">
          <p style="color: var(--text-secondary); margin-bottom: 1rem;">
            <i data-lucide="clock" style="width: 16px; height: 16px; display: inline; vertical-align: middle; margin-right: 0.5rem;"></i>
            Watch the video to unlock the quiz. Quiz unlocks in <span id="timer" style="font-weight: 600; color: var(--primary);">15</span> seconds.
          </p>
          <div style="width: 100%; background: var(--bg-secondary); border-radius: 9999px; height: 8px; overflow: hidden;">
            <div id="progress-bar" style="background: var(--primary); height: 100%; width: 0%; transition: width 1s linear;"></div>
          </div>
        </div>

        <div id="quiz-section" style="display: none;">
          <div style="display: flex; align-items: center; gap: 0.5rem; color: #10b981; margin-bottom: 1rem;">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" style="width: 20px; height: 20px;">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
            </svg>
            <span style="font-weight: 500;">Video completed! You can now take the quiz.</span>
          </div>
          <a th:href="@{/student/courses/quiz(courseId=${courseId})}" class="btn-dashboard btn-primary">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" /></svg>
            Start Quiz
          </a>
        </div>
      </div>
    </div>

  </section>
</main>

<script>
  lucide.createIcons();

  // Demo timer for testing
  const DEMO_DURATION = 15;
  let timeLeft = DEMO_DURATION;
  const timerElement = document.getElementById('timer');
  const progressBar = document.getElementById('progress-bar');
  const timerSection = document.getElementById('timer-section');
  const quizSection = document.getElementById('quiz-section');

  const timer = setInterval(() => {
    timeLeft--;
    timerElement.textContent = timeLeft;
    progressBar.style.width = ((DEMO_DURATION - timeLeft) / DEMO_DURATION * 100) + '%';

    if (timeLeft <= 0) {
      clearInterval(timer);
      timerSection.style.display = 'none';
      quizSection.style.display = 'block';
    }
  }, 1000);
</script>

</body>
</html>
